name: Property Tests

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Nightly deep run at 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      rapid_checks:
        description: "Number of rapid examples per property (default 1000)."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: property-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  property:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve example count
        id: checks
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.rapid_checks }}" ]]; then
            checks="${{ inputs.rapid_checks }}"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            checks=20000
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            checks=1000
          else
            checks=5000
          fi
          echo "rapid_checks=$checks" >> "$GITHUB_OUTPUT"

      # Greenfield-scoped, exactly as check-ci scopes coverage (backlog CI-PROP-1). The frozen
      # v0.3.x tree holds a known non-idempotent redactor that surfaces roughly one nightly run
      # in four at 20000 examples and CANNOT be fixed — the tree is reference-only. Gating on it
      # meant a scheduled job red a quarter of the time, which trains everyone to ignore it and
      # would then hide a real greenfield property failure. `make test-property` still runs the
      # whole repo for anyone who wants it.
      - name: Run property tests (greenfield)
        run: make test-property-greenfield RAPID_CHECKS=${{ steps.checks.outputs.rapid_checks }}
