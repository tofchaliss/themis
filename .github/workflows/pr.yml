name: Pull Request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Installed as a plain binary (not golangci-lint-action) so it is not run
      # twice: `make check` -> `make lint` already runs `golangci-lint run ./...`.
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Greenfield-scoped quality gate: build · test · lint · clean-arch · arch-test ·
      # coverage-greenfield · deadcode. Coverage self-provisions embedded Postgres.
      # The frozen v0.3.x legacy tree is excluded from coverage — its integration tests
      # are green only on macOS's coarse clock. PR runs the same gate as main, so main
      # cannot go red post-merge.
      - name: make check-ci
        run: make check-ci

      # Deterministic no-AI end-to-end gate: register a release → upload SBOM → correlate → open a
      # Finding → govern an "affected" Position → publish OpenVEX, asserting the artifact names the
      # CVE. Runs no model; self-provisions embedded Postgres. Guards the whole greenfield pipeline
      # on every PR (previously only post-merge in main.yml), so a break in the SBOM→VEX flow can
      # never reach main.
      - name: make e2e-pipeline (no-AI SBOM→VEX gate)
        run: make e2e-pipeline

      # The Evidence-specific e2e kept the ORIGINAL blind spot after the pipeline e2e moved here:
      # it ran only post-merge, so a change that breaks it merged green and reddened `main`
      # afterwards. That is exactly how PR #55 landed (an outbox column rename the e2e helper still
      # referenced), fixed in #56. Both e2e suites are now pre-merge gates.
      - name: make e2e-evidence (Evidence register → upload → inventory)
        run: make e2e-evidence
