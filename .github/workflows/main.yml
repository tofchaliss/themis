name: Main

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Installed as a plain binary (not golangci-lint-action) so it is not run
      # twice: `make check` -> `make lint` already runs `golangci-lint run ./...`.
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Greenfield-scoped quality gate: build · test · lint · clean-arch · arch-test ·
      # coverage-greenfield · deadcode. The frozen v0.3.x legacy tree is excluded from
      # coverage (its integration tests are green only on macOS's coarse clock).
      - name: make check-ci
        run: make check-ci

      # Post-merge only: the slower Evidence end-to-end (self-provisions embedded
      # Postgres). Kept off PRs to keep pre-merge feedback fast.
      - name: make e2e-evidence
        run: make e2e-evidence

      # Post-merge only: the full in-process pipeline e2e (M5) — all four contexts +
      # the `bus` database on one embedded Postgres, SBOM in → published OpenVEX out.
      - name: make e2e-pipeline
        run: make e2e-pipeline
