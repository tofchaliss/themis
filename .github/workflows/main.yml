name: Main

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Installed as a plain binary (not golangci-lint-action) so it is not run
      # twice: `make check` -> `make lint` already runs `golangci-lint run ./...`.
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The full quality gate, identical to the local `make check`:
      # build · lint · clean-arch · arch-test · coverage · deadcode.
      - name: make check
        run: make check

      # Post-merge only: the slower Evidence end-to-end (self-provisions embedded
      # Postgres). Kept off PRs to keep pre-merge feedback fast.
      - name: make e2e-evidence
        run: make e2e-evidence
