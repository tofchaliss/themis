openapi: 3.0.3
info:
  title: Themis Communication API
  version: 1.0.0
  description: >
    Communication context (Phase-3 greenfield) — the publication surface. Trigger the
    materialization of an Enterprise Position into an audience artifact (human-triggered —
    no automation), read recorded Publications and their (regenerable) payloads, list the
    publishable-positions worklist, and preview a Position render without recording. The
    artifact's stance is always fixed by the Position (never reinterpreted).
servers:
  - url: /api/v1
paths:
  /publications:
    post:
      operationId: createPublication
      summary: Trigger materialization of a Position into a recorded Publication (human-triggered).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicationRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePublicationResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
    get:
      operationId: listPublications
      summary: List recorded Publications for a Release.
      parameters:
        - name: release
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicationView'
        '500':
          $ref: '#/components/responses/Problem'
  /publications/{id}:
    get:
      operationId: getPublication
      summary: Get a recorded Publication (payload regenerated if pruned).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationView'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /previews:
    post:
      operationId: previewPublication
      summary: Render a Position into an artifact without recording a Publication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewRequest'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /rollups:
    get:
      operationId: listRollups
      summary: List a release's VEX rollups, newest first (the full supersession history - D5 keeps both).
      parameters:
        - name: release
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RollupView'
        '500':
          $ref: '#/components/responses/Problem'
  /rollups/{id}:
    get:
      operationId: getRollup
      summary: Get one recorded rollup (metadata + the rendered document).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollupView'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /releases/{id}/rollup-status:
    get:
      operationId: getRollupStatus
      summary: >-
        The worklist staleness row (D13.2): the current rollup for (release, format, audience)
        and its computed drift against the live posture - exact, not approximated, thanks to the
        recorded input set. Republishing stays a human act.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
            default: openvex
        - name: audience
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollupStatus'
        '500':
          $ref: '#/components/responses/Problem'
  /callbacks/ci-rebuild:
    post:
      operationId: recordCIRebuildCallback
      summary: >
        CI rebuild callback (EDR-DELIVERY-01 M2-7). The build job Themis asked for reports the
        intent it served, the NEW SBOM it uploaded and the image it built. Accepted only from a key
        holding the `delivery:callback` scope and no other; recorded as governed-external evidence
        on the intent. It changes no Finding, no Position and no posture. The same route takes the
        connector's small STATUS call (EDR-REBUILD-01 D28): a body that carries `status`
        (`submitted`, `refused` or `uncertain`) reports what became of one request and needs
        neither `sbom_id` nor `image_digest`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CIRebuildCallback'
      responses:
        '202':
          description: Recorded (or already recorded for this intent and SBOM).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIRebuildCallbackAck'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /releases/{id}/rebuild-cycle:
    get:
      operationId: getReleaseRebuildCycle
      summary: >
        The newest rebuild cycle of a Release with its requests, and the decision that is held
        back, if any (EDR-REBUILD-01 step R3). Read-only. A Release with no cycle and no hold
        answers with both absent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebuildCycleView'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /releases/{id}/rebuild-cycle/request-again:
    post:
      operationId: requestRebuildAgain
      summary: >
        Make the waiting request of the Release's open cycle again, on a person's word
        (EDR-REBUILD-01 D20 item 3, D40): the same attempt with the next try number, after a
        refusal or a `not_submitted`. Admin key, or the key of the Release's Product; the body
        names the person.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebuildActorRequest'
      responses:
        '201':
          description: The new request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebuildRequest'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /releases/{id}/rebuild-cycle/stop:
    post:
      operationId: stopRebuildCycle
      summary: >
        Stop the Release's open rebuild cycle, on a person's word. No further request is made in
        it; what was already sent is not taken back. Admin key, or the key of the Release's
        Product; the body names the person.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebuildActorRequest'
      responses:
        '200':
          description: The stopped cycle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebuildCycle'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /rebuild-requests/{intent_id}/settle:
    post:
      operationId: settleRebuildRequest
      summary: >
        Settle an uncertain rebuild request (EDR-REBUILD-01 D24): a person answers `submitted`
        (the attempt stays used) or `not_submitted` (the attempt is given back and the request
        may be made again). The answer, the person and the time are recorded. Admin key, or the
        key of the Release's Product.
      parameters:
        - name: intent_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebuildSettleRequest'
      responses:
        '200':
          description: The settled request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebuildRequest'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /reports/remediation-metrics:
    get:
      operationId: getRemediationMetricsReport
      summary: >
        The remediation-metrics report (EDR-REMEDIATION-01 D6), rendered on request from
        Governance's figures — markdown for people (default) or JSON for tools. Stored nowhere.
        Time to remediation and time to resolution are reported as two labelled measures, never
        merged (D8 Q4).
      parameters:
        - name: product
          in: query
          required: false
          description: Keep only this Product (id or name); the estate figures are always included.
          schema:
            type: string
        - name: tag
          in: query
          required: false
          description: Keep only Findings on releases carrying this tag (EDR-REMEDIATION-01 D7), estate figures included.
          schema:
            type: string
        - name: format
          in: query
          required: false
          description: markdown (default) or json.
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            text/markdown:
              schema:
                type: string
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /webhook-health:
    get:
      operationId: getWebhookHealth
      summary: >
        Health of each webhook destination that has been sent to (EDR-REMEDIATION-01 D4):
        active, active_tmp (a failure, retrying), inactive_tmp (paused after repeated failures,
        tried again after paused_until) or inactive_permanent (an operator re-enables it with
        `deliveryctl webhook-enable`). Destinations are audience names; URLs are never returned.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookHealth'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /publishable-positions:
    get:
      operationId: getPublishableQueue
      summary: The analyst worklist — Positions ready to publish or gone stale.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueueEntryView'
        '500':
          $ref: '#/components/responses/Problem'
components:
  responses:
    Problem:
      description: Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    WebhookHealth:
      type: object
      required: [destination, state, consecutive_failures]
      properties:
        destination:
          type: string
        state:
          type: string
          enum: [active, active_tmp, inactive_tmp, inactive_permanent]
        consecutive_failures:
          type: integer
        paused_until:
          type: string
          format: date-time
        last_success_at:
          type: string
          format: date-time
        last_failure_at:
          type: string
          format: date-time
        last_error:
          type: string
    CIRebuildCallback:
      type: object
      required: [intent_id]
      description: >-
        Two reports share this body. Without `status` it is the BUILD report and `sbom_id` and
        `image_digest` are required. With `status` it is the connector's status call for one
        request (EDR-REBUILD-01 D28) and only `intent_id` and `status` are required.
      properties:
        intent_id:
          type: string
          description: The rebuild intent this report is about (the event id, or THEMIS_INTENT_ID as the job received it).
        sbom_id:
          type: string
          description: The Evidence id of the NEW SBOM the job uploaded. Required for a build report (RC-3).
        image_digest:
          type: string
          description: The built image's digest. Required for a build report (RC-3).
        build_id:
          type: string
          description: The job's own build identifier, as given.
        git_ref:
          type: string
          description: The revision built, as given.
        status:
          type: string
          enum: [submitted, refused, uncertain]
          description: >-
            What became of the request: the build system accepted the build (`submitted`), the
            connector did not submit it (`refused`, not an attempt), or the connector cannot tell
            (`uncertain`, a person settles it).
        reason:
          type: string
          description: Why, for `refused` and `uncertain`.
        build_ref:
          type: string
          description: The identity the build system gave the build at `submitted` (a queue item or a run id).
        execution_started:
          type: boolean
          description: Optional. The build system says the build is running. Shown, counted nowhere.
    CIRebuildCallbackAck:
      type: object
      required: [intent_id, received_at]
      properties:
        intent_id:
          type: string
        sbom_id:
          type: string
        state:
          type: string
          description: The state of the rebuild request after this report, when the intent has one.
        received_at:
          type: string
          format: date-time
    RebuildActorRequest:
      type: object
      required: [actor]
      properties:
        actor:
          type: string
          description: The person who asks. Recorded.
        note:
          type: string
    RebuildSettleRequest:
      type: object
      required: [answer, actor]
      properties:
        answer:
          type: string
          enum: [submitted, not_submitted]
        actor:
          type: string
          description: The person who settles. Recorded.
        note:
          type: string
    RebuildRequest:
      type: object
      description: One request of a rebuild cycle - one intent, one attempt number, one try number. Evidence about a request; it changes no Finding.
      required: [intent_id, cycle_id, release_id, decision_id, attempt, try, channel, state, requested_at]
      properties:
        intent_id: { type: string }
        cycle_id: { type: integer, format: int64 }
        release_id: { type: string }
        decision_id: { type: string }
        attempt: { type: integer }
        try: { type: integer }
        channel:
          type: string
          description: webhook (the signed rebuild_requested event) or jenkins (the built-in sender).
        state:
          type: string
          enum: [requested, delivered, submitted, refused, uncertain, not_submitted, build_reported, evaluated]
        reason: { type: string }
        build_ref: { type: string }
        requested_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time }
        status_at: { type: string, format: date-time }
        execution_started_at: { type: string, format: date-time }
        reported_by: { type: string }
        settled_answer: { type: string }
        settled_by: { type: string }
        settled_at: { type: string, format: date-time }
        settle_note: { type: string }
    RebuildCycle:
      type: object
      required: [id, release_id, origin, state, attempts, refusals, targeted, opened_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        release_id: { type: string }
        origin:
          type: string
          enum: [evaluation, decision]
          description: What opened the cycle - the posture of a new SBOM, or a rebuild decision of Governance.
        decision_id: { type: string }
        state:
          type: string
          enum: [open, succeeded, exhausted, refused, stopped]
        attempts: { type: integer }
        max_attempts: { type: integer }
        refusals: { type: integer }
        targeted:
          type: array
          items: { type: string }
        joined_decision_ids:
          type: array
          items: { type: string }
        baseline_sbom_id: { type: string }
        last_sbom_id: { type: string }
        closed_by: { type: string }
        closed_note: { type: string }
        opened_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RebuildHold:
      type: object
      description: A rebuild decision that opened no cycle, and why (EDR-REBUILD-01 D14 item 5).
      required: [decision_id, reason, recorded_at]
      properties:
        decision_id: { type: string }
        reason:
          type: string
          enum: [cool_down, unsigned_route]
        held_until: { type: string, format: date-time }
        recorded_at: { type: string, format: date-time }
    RebuildCycleView:
      type: object
      required: [release_id, requests]
      properties:
        release_id: { type: string }
        cycle:
          $ref: '#/components/schemas/RebuildCycle'
        requests:
          type: array
          items:
            $ref: '#/components/schemas/RebuildRequest'
        hold:
          $ref: '#/components/schemas/RebuildHold'
    CreatePublicationRequest:
      type: object
      required: [artifact_type, format]
      description: >-
        The subject is a UNION (EDR-COMMUNICATION-01 D13.5): exactly one of finding_id (a
        per-Position artifact, D3) or release_id (the release-scoped VEX rollup, D13 - only
        artifact_type `vex` is valid there). Supplying both or neither is a 400.
      properties:
        finding_id:
          type: string
        release_id:
          type: string
          description: >-
            The release whose rollup to materialize (D13): one multi-statement document over
            the whole posture - statements from Positions only, machine clearances as
            annotations, full coverage, recorded input set. Refused (422) when the Registry
            name chain cannot identify the product (fail-closed, D13.4).
        artifact_type:
          type: string
          description: vex | advisory | notification | audit_report
        format:
          type: string
          description: openvex | cyclonedx-vex | csaf | markdown | json-report | text
        audience:
          type: string
        channel:
          type: string
    CreatePublicationResponse:
      type: object
      properties:
        publication_id:
          type: string
          description: >-
            The new record's id - a per-Finding Publication for a finding_id subject, a release
            rollup for a release_id subject (fetch the latter via GET /rollups/{id}).
    RollupView:
      type: object
      properties:
        id: { type: string }
        release_id: { type: string }
        product_purl:
          type: string
          description: The Registry-derived customer-facing product identity (D13.4).
        format: { type: string }
        audience: { type: string }
        as_of:
          type: string
          description: The snapshot's vintage (RFC3339) - also stated inside the document itself.
        statements: { type: integer }
        withdrawn_excluded: { type: integer }
        supersedes_id: { type: string }
        superseded_by: { type: string }
        created_at: { type: string }
        payload:
          type: string
          description: The rendered document (e.g. the OpenVEX JSON), verbatim.
    RollupStatus:
      type: object
      properties:
        found:
          type: boolean
          description: false when no rollup was ever published for this (release, format, audience).
        publication_id: { type: string }
        as_of: { type: string }
        statements: { type: integer }
        stale:
          type: boolean
          description: >-
            true when the live posture differs from the rollup's recorded input set - any new
            or removed finding, changed decision, or annotation-only change.
        summary:
          type: string
          description: Plain-language drift summary ("current", or "STALE - 1 changed decision(s), ...").
        drift:
          type: object
          properties:
            changed_decisions: { type: integer }
            new_findings: { type: integer }
            removed_findings: { type: integer }
            annotation_only:
              type: integer
              description: Same decision, different annotation fingerprint - minor drift (D13.2).
    PreviewRequest:
      type: object
      required: [artifact_type, format]
      description: Same subject union as CreatePublicationRequest - exactly one of finding_id / release_id.
      properties:
        finding_id:
          type: string
        release_id:
          type: string
        artifact_type:
          type: string
        format:
          type: string
    PreviewResponse:
      type: object
      properties:
        payload:
          type: string
    PublicationView:
      type: object
      properties:
        id:
          type: string
        artifact_type:
          type: string
        stance:
          type: string
        format:
          type: string
        audience:
          type: string
        channel:
          type: string
        position_version:
          type: integer
        release_id:
          type: string
        finding_id:
          type: string
        faultline_id:
          type: string
        cve:
          type: string
        delivery_status:
          type: string
        superseded:
          type: boolean
        payload:
          type: string
    QueueEntryView:
      type: object
      properties:
        finding_id:
          type: string
        release_id:
          type: string
        faultline_id:
          type: string
        cve:
          type: string
        version:
          type: integer
        stance:
          type: string
        stale:
          type: boolean
    Problem:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
