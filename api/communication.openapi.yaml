openapi: 3.0.3
info:
  title: Themis Communication API
  version: 1.0.0
  description: >
    Communication context (Phase-3 greenfield) — the publication surface. Trigger the
    materialization of an Enterprise Position into an audience artifact (human-triggered —
    no automation), read recorded Publications and their (regenerable) payloads, list the
    publishable-positions worklist, and preview a Position render without recording. The
    artifact's stance is always fixed by the Position (never reinterpreted).
servers:
  - url: /api/v1
paths:
  /publications:
    post:
      operationId: createPublication
      summary: Trigger materialization of a Position into a recorded Publication (human-triggered).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicationRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePublicationResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
    get:
      operationId: listPublications
      summary: List recorded Publications for a Release.
      parameters:
        - name: release
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicationView'
        '500':
          $ref: '#/components/responses/Problem'
  /publications/{id}:
    get:
      operationId: getPublication
      summary: Get a recorded Publication (payload regenerated if pruned).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationView'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /previews:
    post:
      operationId: previewPublication
      summary: Render a Position into an artifact without recording a Publication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewRequest'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /rollups:
    get:
      operationId: listRollups
      summary: List a release's VEX rollups, newest first (the full supersession history - D5 keeps both).
      parameters:
        - name: release
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RollupView'
        '500':
          $ref: '#/components/responses/Problem'
  /rollups/{id}:
    get:
      operationId: getRollup
      summary: Get one recorded rollup (metadata + the rendered document).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollupView'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /releases/{id}/rollup-status:
    get:
      operationId: getRollupStatus
      summary: >-
        The worklist staleness row (D13.2): the current rollup for (release, format, audience)
        and its computed drift against the live posture - exact, not approximated, thanks to the
        recorded input set. Republishing stays a human act.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
            default: openvex
        - name: audience
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollupStatus'
        '500':
          $ref: '#/components/responses/Problem'
  /callbacks/ci-rebuild:
    post:
      operationId: recordCIRebuildCallback
      summary: >
        CI rebuild callback (EDR-DELIVERY-01 M2-7). The build job Themis asked for reports the
        intent it served, the NEW SBOM it uploaded and the image it built. Accepted only from a key
        holding the `delivery:callback` scope and no other; recorded as governed-external evidence
        on the intent. It changes no Finding, no Position and no posture.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CIRebuildCallback'
      responses:
        '202':
          description: Recorded (or already recorded for this intent and SBOM).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIRebuildCallbackAck'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /webhook-health:
    get:
      operationId: getWebhookHealth
      summary: >
        Health of each webhook destination that has been sent to (EDR-REMEDIATION-01 D4):
        active, active_tmp (a failure, retrying), inactive_tmp (paused after repeated failures,
        tried again after paused_until) or inactive_permanent (an operator re-enables it with
        `deliveryctl webhook-enable`). Destinations are audience names; URLs are never returned.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookHealth'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /publishable-positions:
    get:
      operationId: getPublishableQueue
      summary: The analyst worklist — Positions ready to publish or gone stale.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueueEntryView'
        '500':
          $ref: '#/components/responses/Problem'
components:
  responses:
    Problem:
      description: Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    WebhookHealth:
      type: object
      required: [destination, state, consecutive_failures]
      properties:
        destination:
          type: string
        state:
          type: string
          enum: [active, active_tmp, inactive_tmp, inactive_permanent]
        consecutive_failures:
          type: integer
        paused_until:
          type: string
          format: date-time
        last_success_at:
          type: string
          format: date-time
        last_failure_at:
          type: string
          format: date-time
        last_error:
          type: string
    CIRebuildCallback:
      type: object
      required: [intent_id, sbom_id, image_digest]
      properties:
        intent_id:
          type: string
          description: The ci_rebuild intent this build served (THEMIS_INTENT_ID as the job received it).
        sbom_id:
          type: string
          description: The Evidence id of the NEW SBOM the job uploaded. Required (RC-3).
        image_digest:
          type: string
          description: The built image's digest. Required (RC-3).
        build_id:
          type: string
          description: The job's own build identifier, as given.
        git_ref:
          type: string
          description: The revision built, as given.
    CIRebuildCallbackAck:
      type: object
      required: [intent_id, sbom_id, received_at]
      properties:
        intent_id:
          type: string
        sbom_id:
          type: string
        received_at:
          type: string
          format: date-time
    CreatePublicationRequest:
      type: object
      required: [artifact_type, format]
      description: >-
        The subject is a UNION (EDR-COMMUNICATION-01 D13.5): exactly one of finding_id (a
        per-Position artifact, D3) or release_id (the release-scoped VEX rollup, D13 - only
        artifact_type `vex` is valid there). Supplying both or neither is a 400.
      properties:
        finding_id:
          type: string
        release_id:
          type: string
          description: >-
            The release whose rollup to materialize (D13): one multi-statement document over
            the whole posture - statements from Positions only, machine clearances as
            annotations, full coverage, recorded input set. Refused (422) when the Registry
            name chain cannot identify the product (fail-closed, D13.4).
        artifact_type:
          type: string
          description: vex | advisory | notification | audit_report
        format:
          type: string
          description: openvex | cyclonedx-vex | csaf | markdown | json-report | text
        audience:
          type: string
        channel:
          type: string
    CreatePublicationResponse:
      type: object
      properties:
        publication_id:
          type: string
          description: >-
            The new record's id - a per-Finding Publication for a finding_id subject, a release
            rollup for a release_id subject (fetch the latter via GET /rollups/{id}).
    RollupView:
      type: object
      properties:
        id: { type: string }
        release_id: { type: string }
        product_purl:
          type: string
          description: The Registry-derived customer-facing product identity (D13.4).
        format: { type: string }
        audience: { type: string }
        as_of:
          type: string
          description: The snapshot's vintage (RFC3339) - also stated inside the document itself.
        statements: { type: integer }
        withdrawn_excluded: { type: integer }
        supersedes_id: { type: string }
        superseded_by: { type: string }
        created_at: { type: string }
        payload:
          type: string
          description: The rendered document (e.g. the OpenVEX JSON), verbatim.
    RollupStatus:
      type: object
      properties:
        found:
          type: boolean
          description: false when no rollup was ever published for this (release, format, audience).
        publication_id: { type: string }
        as_of: { type: string }
        statements: { type: integer }
        stale:
          type: boolean
          description: >-
            true when the live posture differs from the rollup's recorded input set - any new
            or removed finding, changed decision, or annotation-only change.
        summary:
          type: string
          description: Plain-language drift summary ("current", or "STALE - 1 changed decision(s), ...").
        drift:
          type: object
          properties:
            changed_decisions: { type: integer }
            new_findings: { type: integer }
            removed_findings: { type: integer }
            annotation_only:
              type: integer
              description: Same decision, different annotation fingerprint - minor drift (D13.2).
    PreviewRequest:
      type: object
      required: [artifact_type, format]
      description: Same subject union as CreatePublicationRequest - exactly one of finding_id / release_id.
      properties:
        finding_id:
          type: string
        release_id:
          type: string
        artifact_type:
          type: string
        format:
          type: string
    PreviewResponse:
      type: object
      properties:
        payload:
          type: string
    PublicationView:
      type: object
      properties:
        id:
          type: string
        artifact_type:
          type: string
        stance:
          type: string
        format:
          type: string
        audience:
          type: string
        channel:
          type: string
        position_version:
          type: integer
        release_id:
          type: string
        finding_id:
          type: string
        faultline_id:
          type: string
        cve:
          type: string
        delivery_status:
          type: string
        superseded:
          type: boolean
        payload:
          type: string
    QueueEntryView:
      type: object
      properties:
        finding_id:
          type: string
        release_id:
          type: string
        faultline_id:
          type: string
        cve:
          type: string
        version:
          type: integer
        stance:
          type: string
        stale:
          type: boolean
    Problem:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
