openapi: 3.0.3
info:
  title: Themis Communication API
  version: 1.0.0
  description: >
    Communication context (Phase-3 greenfield) — the publication surface. Trigger the
    materialization of an Enterprise Position into an audience artifact (human-triggered —
    no automation), read recorded Publications and their (regenerable) payloads, list the
    publishable-positions worklist, and preview a Position render without recording. The
    artifact's stance is always fixed by the Position (never reinterpreted).
servers:
  - url: /api/v1
paths:
  /publications:
    post:
      operationId: createPublication
      summary: Trigger materialization of a Position into a recorded Publication (human-triggered).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicationRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePublicationResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
    get:
      operationId: listPublications
      summary: List recorded Publications for a Release.
      parameters:
        - name: release
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicationView'
        '500':
          $ref: '#/components/responses/Problem'
  /publications/{id}:
    get:
      operationId: getPublication
      summary: Get a recorded Publication (payload regenerated if pruned).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationView'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /previews:
    post:
      operationId: previewPublication
      summary: Render a Position into an artifact without recording a Publication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewRequest'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /rollups:
    get:
      operationId: listRollups
      summary: List a release's VEX rollups, newest first (the full supersession history - D5 keeps both).
      parameters:
        - name: release
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RollupView'
        '500':
          $ref: '#/components/responses/Problem'
  /rollups/{id}:
    get:
      operationId: getRollup
      summary: Get one recorded rollup (metadata + the rendered document).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollupView'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /releases/{id}/rollup-status:
    get:
      operationId: getRollupStatus
      summary: >-
        The worklist staleness row (D13.2): the current rollup for (release, format, audience)
        and its computed drift against the live posture - exact, not approximated, thanks to the
        recorded input set. Republishing stays a human act.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
            default: openvex
        - name: audience
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollupStatus'
        '500':
          $ref: '#/components/responses/Problem'
  /delivery/intents:
    get:
      operationId: listDeliveryIntents
      summary: >-
        List outward-action delivery intents (EDR-DELIVERY-01 N-M1a) - the operator's view of
        what Themis decided to send outside the estate and how it went. Admin-only, like every
        route under /delivery.
      description: >-
        AUTH, and which layer answers what: a 401 is never produced by this route - an
        unauthenticated request is refused upstream by the node's auth middleware
        (auth.RequireAPIKey) and never reaches the handler. The 403 IS this route's own: the
        /delivery surface is admin-only, reads included, because a delivery intent's lineage
        does not always reach a product and so a product-scoped key cannot be confined to one
        (EDR-DELIVERY-01 D15). On a node with inbound auth disabled there is no principal at
        all and the whole /api/v1 surface is open, exactly as for every other route. A 501
        means this node does not serve the operator surface: it is OFF BY DEFAULT while the
        API addition awaits owner approval - set THEMIS_DELIVERY_OPERATOR_API=1 to enable it.
        Delivery intents are recorded, sent and dead-lettered either way.
      parameters:
        - name: status
          in: query
          required: false
          description: PENDING | DELIVERED | DEAD_LETTER | CANCELLED (case-insensitive). Omit for any.
          schema:
            type: string
        - name: kind
          in: query
          required: false
          description: jira_issue | email | ci_build. Omit for any.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryIntent'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '501':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /delivery/intents/{id}:
    get:
      operationId: getDeliveryIntent
      summary: One delivery intent with its full append-only attempt history.
      description: >-
        AUTH, and which layer answers what: a 401 is never produced by this route - an
        unauthenticated request is refused upstream by the node's auth middleware
        (auth.RequireAPIKey) and never reaches the handler. The 403 IS this route's own: the
        /delivery surface is admin-only, reads included, because a delivery intent's lineage
        does not always reach a product and so a product-scoped key cannot be confined to one
        (EDR-DELIVERY-01 D15). On a node with inbound auth disabled there is no principal at
        all and the whole /api/v1 surface is open, exactly as for every other route. A 501
        means this node does not serve the operator surface: it is OFF BY DEFAULT while the
        API addition awaits owner approval - set THEMIS_DELIVERY_OPERATOR_API=1 to enable it.
        Delivery intents are recorded, sent and dead-lettered either way.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryIntent'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '501':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /delivery/intents/{id}/retry:
    post:
      operationId: retryDeliveryIntent
      summary: >-
        Re-open a dead-lettered or cancelled intent for the workers - PENDING again, attempts
        back to zero, due immediately. The attempt HISTORY is kept: a retry adds a chapter, it
        does not erase one. Refused (409) on a PENDING or DELIVERED intent.
      description: >-
        AUTH, and which layer answers what: a 401 is never produced by this route - an
        unauthenticated request is refused upstream by the node's auth middleware
        (auth.RequireAPIKey) and never reaches the handler. The 403 IS this route's own: the
        /delivery surface is admin-only, reads included, because a delivery intent's lineage
        does not always reach a product and so a product-scoped key cannot be confined to one
        (EDR-DELIVERY-01 D15). On a node with inbound auth disabled there is no principal at
        all and the whole /api/v1 surface is open, exactly as for every other route. A 501
        means this node does not serve the operator surface: it is OFF BY DEFAULT while the
        API addition awaits owner approval - set THEMIS_DELIVERY_OPERATOR_API=1 to enable it.
        Delivery intents are recorded, sent and dead-lettered either way.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Re-opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryIntent'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '501':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /delivery/intents/{id}/cancel:
    post:
      operationId: cancelDeliveryIntent
      summary: >-
        Withdraw a PENDING intent. The record survives as the statement that a human decided
        this outward action should not happen. Cancelling an already-cancelled intent is a
        no-op success; anything else (DELIVERED, DEAD_LETTER) is refused (409).
      description: >-
        AUTH, and which layer answers what: a 401 is never produced by this route - an
        unauthenticated request is refused upstream by the node's auth middleware
        (auth.RequireAPIKey) and never reaches the handler. The 403 IS this route's own: the
        /delivery surface is admin-only, reads included, because a delivery intent's lineage
        does not always reach a product and so a product-scoped key cannot be confined to one
        (EDR-DELIVERY-01 D15). On a node with inbound auth disabled there is no principal at
        all and the whole /api/v1 surface is open, exactly as for every other route. A 501
        means this node does not serve the operator surface: it is OFF BY DEFAULT while the
        API addition awaits owner approval - set THEMIS_DELIVERY_OPERATOR_API=1 to enable it.
        Delivery intents are recorded, sent and dead-lettered either way.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryIntent'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '501':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /publishable-positions:
    get:
      operationId: getPublishableQueue
      summary: The analyst worklist — Positions ready to publish or gone stale.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueueEntryView'
        '500':
          $ref: '#/components/responses/Problem'
components:
  responses:
    Problem:
      description: Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CreatePublicationRequest:
      type: object
      required: [artifact_type, format]
      description: >-
        The subject is a UNION (EDR-COMMUNICATION-01 D13.5): exactly one of finding_id (a
        per-Position artifact, D3) or release_id (the release-scoped VEX rollup, D13 - only
        artifact_type `vex` is valid there). Supplying both or neither is a 400.
      properties:
        finding_id:
          type: string
        release_id:
          type: string
          description: >-
            The release whose rollup to materialize (D13): one multi-statement document over
            the whole posture - statements from Positions only, machine clearances as
            annotations, full coverage, recorded input set. Refused (422) when the Registry
            name chain cannot identify the product (fail-closed, D13.4).
        artifact_type:
          type: string
          description: vex | advisory | notification | audit_report
        format:
          type: string
          description: openvex | cyclonedx-vex | csaf | markdown | json-report | text
        audience:
          type: string
        channel:
          type: string
    CreatePublicationResponse:
      type: object
      properties:
        publication_id:
          type: string
          description: >-
            The new record's id - a per-Finding Publication for a finding_id subject, a release
            rollup for a release_id subject (fetch the latter via GET /rollups/{id}).
    RollupView:
      type: object
      properties:
        id: { type: string }
        release_id: { type: string }
        product_purl:
          type: string
          description: The Registry-derived customer-facing product identity (D13.4).
        format: { type: string }
        audience: { type: string }
        as_of:
          type: string
          description: The snapshot's vintage (RFC3339) - also stated inside the document itself.
        statements: { type: integer }
        withdrawn_excluded: { type: integer }
        supersedes_id: { type: string }
        superseded_by: { type: string }
        created_at: { type: string }
        payload:
          type: string
          description: The rendered document (e.g. the OpenVEX JSON), verbatim.
    RollupStatus:
      type: object
      properties:
        found:
          type: boolean
          description: false when no rollup was ever published for this (release, format, audience).
        publication_id: { type: string }
        as_of: { type: string }
        statements: { type: integer }
        stale:
          type: boolean
          description: >-
            true when the live posture differs from the rollup's recorded input set - any new
            or removed finding, changed decision, or annotation-only change.
        summary:
          type: string
          description: Plain-language drift summary ("current", or "STALE - 1 changed decision(s), ...").
        drift:
          type: object
          properties:
            changed_decisions: { type: integer }
            new_findings: { type: integer }
            removed_findings: { type: integer }
            annotation_only:
              type: integer
              description: Same decision, different annotation fingerprint - minor drift (D13.2).
    PreviewRequest:
      type: object
      required: [artifact_type, format]
      description: Same subject union as CreatePublicationRequest - exactly one of finding_id / release_id.
      properties:
        finding_id:
          type: string
        release_id:
          type: string
        artifact_type:
          type: string
        format:
          type: string
    PreviewResponse:
      type: object
      properties:
        payload:
          type: string
    PublicationView:
      type: object
      properties:
        id:
          type: string
        artifact_type:
          type: string
        stance:
          type: string
        format:
          type: string
        audience:
          type: string
        channel:
          type: string
        position_version:
          type: integer
        release_id:
          type: string
        finding_id:
          type: string
        faultline_id:
          type: string
        cve:
          type: string
        delivery_status:
          type: string
        superseded:
          type: boolean
        payload:
          type: string
    QueueEntryView:
      type: object
      properties:
        finding_id:
          type: string
        release_id:
          type: string
        faultline_id:
          type: string
        cve:
          type: string
        version:
          type: integer
        stance:
          type: string
        stale:
          type: boolean
    DeliveryIntent:
      type: object
      description: >-
        One recorded decision to act outside the estate (EDR-DELIVERY-01 N-M1a). The lineage
        and the payload are a SNAPSHOT frozen when the governance fact crossed the bus, so a
        send that happens later delivers what the fact said THEN. `destination` is a governed
        NAME, never a credential - no secret is ever stored on an intent (D-N-6).
      properties:
        id:
          type: string
        kind:
          type: string
          description: jira_issue | email | ci_build
        destination:
          type: string
        status:
          type: string
          description: PENDING | DELIVERED | DEAD_LETTER | CANCELLED (forward-only; a retry re-opens, it does not erase).
        attempts:
          type: integer
        max_attempts:
          type: integer
        last_error:
          type: string
        origin_event_id:
          type: string
          description: The causing bus envelope - also the dedup identity, so a replay creates no second intent.
        origin_event_type:
          type: string
        origin_event_time:
          type: string
        finding_id:
          type: string
        release_id:
          type: string
        faultline_id:
          type: string
        cve:
          type: string
        proposal_id:
          type: string
        position_version:
          type: integer
        payload_hash:
          type: string
          description: sha-256 of the materialized payload bytes recorded with the intent.
        next_attempt_at:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        attempts_history:
          type: array
          description: Append-only send history (single-intent reads only; the list omits it).
          items:
            $ref: '#/components/schemas/DeliveryAttempt'
    DeliveryAttempt:
      type: object
      properties:
        attempt_no:
          type: integer
        ok:
          type: boolean
        error:
          type: string
        attempted_at:
          type: string
    Problem:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
