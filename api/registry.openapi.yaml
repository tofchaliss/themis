openapi: 3.0.3
info:
  title: Themis Registry API
  version: 1.0.0
  description: >
    Registry supporting context (Phase-3 greenfield) — register the
    Product → Project → Release structural identity hierarchy and look up Releases.
    Identity + structure only; no security state (Governance owns that).
servers:
  - url: /api/v1
paths:
  /products:
    post:
      operationId: registerProduct
      summary: Register a product; returns a stable Product ID.
      description: >-
        Find-or-create (EDR-INTAKE-01 B4): uniqueness is enforced by the database on
        `lower(name)`, so registering a name that already exists returns the EXISTING id with
        `200` rather than failing or forking a second Product. Two concurrent callers get one
        row. The stored casing is the first caller's.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterProductRequest'
      responses:
        '200':
          description: Already registered — the existing id, unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindOrCreateResponse'
        '201':
          description: Registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindOrCreateResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          description: >-
            A product-scoped key may name only its own product (any case), which returns `200` with its existing id; it never creates a product, and every other name is this same `403` whether or not that product exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      operationId: listProducts
      summary: List products, optionally filtered by exact name.
      description: >-
        The entry point for a human or a GUI (DASH-1). Without this, a release's posture is
        unreachable unless the caller already holds the UUID that `POST /releases` printed —
        which is exactly the coupling a read API exists to remove.
      parameters:
        - name: name
          in: query
          required: false
          schema: { type: string }
          description: Exact product name. Absent = all products.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductView'
  /products/{id}/projects:
    get:
      operationId: listProjectsOfProduct
      summary: List the projects under a product.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: name
          in: query
          required: false
          schema: { type: string }
          description: Exact project name.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectView'
        '404':
          $ref: '#/components/responses/Problem'
  /projects/{id}/releases:
    get:
      operationId: listReleasesOfProject
      summary: List the releases under a project.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: query
          required: false
          schema: { type: string }
          description: Exact release version — completes the product/project/version traversal a human actually has.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReleaseView'
        '404':
          $ref: '#/components/responses/Problem'
  /projects:
    post:
      operationId: registerProject
      summary: Register a project under a product; returns a stable Project ID.
      description: >-
        Find-or-create (EDR-INTAKE-01 B4): unique on `(product_id, lower(name))`, so the same
        project name already registered under this product returns the EXISTING id with `200`.
        The same name under a DIFFERENT product is a different Project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterProjectRequest'
      responses:
        '200':
          description: Already registered — the existing id, unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindOrCreateResponse'
        '201':
          description: Registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindOrCreateResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          description: >-
            A product-scoped key may register only under its own product. Another product, a product that does not exist and an empty id are one byte-identical answer, so the refusal says nothing about the rest of the estate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /releases:
    post:
      operationId: registerRelease
      summary: Register a release under a project; returns a stable Release ID.
      description: >-
        Find-or-create (EDR-INTAKE-01 B4): unique on `(project_id, version)`, so re-registering
        a version returns the EXISTING id with `200` — two bots building one version at the same
        moment get one Release. Version matching is EXACT, never case-folded: a version is a
        machine build string whose case Themis does not own, so `r1917.256` and `R1917.256` are
        two Releases.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterReleaseRequest'
      responses:
        '200':
          description: Already registered — the existing id, unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindOrCreateResponse'
        '201':
          description: Registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindOrCreateResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          description: >-
            A product-scoped key may register only under a project its own product owns. A foreign project and a project that does not exist are one byte-identical answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    get:
      operationId: listReleases
      summary: List the releases of a project.
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Release'
        '400':
          $ref: '#/components/responses/Problem'
  /releases/{id}:
    get:
      operationId: getRelease
      summary: Get a release by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '404':
          $ref: '#/components/responses/Problem'
  /projects/{id}:
    get:
      operationId: getProject
      summary: Get a project by ID (the upward hop of the name chain — release -> project -> product).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectView'
        '404':
          $ref: '#/components/responses/Problem'
  /products/{id}:
    get:
      operationId: getProduct
      summary: Get a product by ID (the top of the name chain).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductView'
        '404':
          $ref: '#/components/responses/Problem'
  /customers:
    post:
      operationId: registerCustomer
      summary: Register a customer; returns a stable Customer ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCustomerRequest'
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          description: >-
            Customers belong to no single product: only an admin key may register one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /products/{id}/microservices:
    post:
      operationId: registerMicroservice
      summary: Register a microservice under a product; returns a stable Microservice ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMicroserviceRequest'
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          description: >-
            A product-scoped key may register only under its own product (same answer for a foreign or missing product).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /microservices/{id}/deployments:
    post:
      operationId: registerDeployment
      summary: Register a deployment of a microservice for a customer; returns a stable Deployment ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeploymentRequest'
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          description: >-
            A deployment links a product's microservice to a customer, which spans products: only an admin key may register one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /releases/{id}/blast-radius:
    get:
      operationId: getBlastRadius
      summary: Count the unique customers a release reaches through the estate graph.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlastRadius'
        '400':
          $ref: '#/components/responses/Problem'
components:
  responses:
    Problem:
      description: Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    RegisterProductRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    RegisterProjectRequest:
      type: object
      required: [product_id, name]
      properties:
        product_id:
          type: string
        name:
          type: string
    RegisterReleaseRequest:
      type: object
      required: [project_id, version]
      properties:
        project_id:
          type: string
        version:
          type: string
    RegisterResponse:
      type: object
      required: [id]
      properties:
        id:
          type: string
    FindOrCreateResponse:
      type: object
      required: [id, created]
      properties:
        id:
          type: string
          description: The surviving row's id — the existing one when `created` is false.
        created:
          type: boolean
          description: >-
            true when THIS request created the row (`201`), false when it already existed
            (`200`). It carries the same answer as the status code, so a client that reads one
            and a client that reads the other cannot be told different stories.
    Release:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        version:
          type: string
    ProductView:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
    ProjectView:
      type: object
      properties:
        id: { type: string }
        product_id: { type: string }
        name: { type: string }
    ReleaseView:
      type: object
      properties:
        id: { type: string }
        project_id: { type: string }
        version: { type: string }
    RegisterCustomerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    RegisterMicroserviceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    RegisterDeploymentRequest:
      type: object
      required: [customer_id, environment]
      properties:
        customer_id:
          type: string
        environment:
          type: string
    BlastRadius:
      type: object
      required: [release_id, unique_customers]
      properties:
        release_id:
          type: string
        unique_customers:
          type: integer
    Problem:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
