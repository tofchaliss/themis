openapi: 3.0.3
info:
  title: Themis Evidence API
  version: 1.0.0
  description: >
    Evidence context (Phase-3 greenfield) — register immutable evidence documents
    (SBOM/VEX) and read back their facts and canonical inventory.
servers:
  - url: /api/v1
paths:
  /evidence:
    post:
      operationId: registerEvidence
      summary: Register an evidence document; returns a stable Evidence ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterEvidenceRequest'
      responses:
        '201':
          description: Registered (new).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterEvidenceResponse'
        '200':
          description: Already registered (idempotent — byte-identical upload to the SAME release).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterEvidenceResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          description: >-
            Byte-identical content is already filed against a DIFFERENT release — this
            release received nothing (D3 note; a new build needs its own document).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    get:
      operationId: listEvidence
      summary: List evidence filed against a release.
      parameters:
        - name: release
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvidenceSummary'
        '400':
          $ref: '#/components/responses/Problem'
  /evidence/{id}:
    get:
      operationId: getEvidence
      summary: Get evidence facts by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceFacts'
        '404':
          $ref: '#/components/responses/Problem'
  /evidence/{id}/inventory:
    get:
      operationId: getEvidenceInventory
      summary: Get the canonical component inventory by evidence ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inventory'
        '404':
          $ref: '#/components/responses/Problem'
  /evidence/{id}/document:
    get:
      operationId: getEvidenceDocument
      summary: Get the raw stored document (bytes as UTF-8 text) + kind by evidence ID. Used by Knowledge to parse an uploaded VEX (Evidence serves the bytes, never parses them).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          $ref: '#/components/responses/Problem'
  /intake:
    post:
      operationId: submitIntake
      summary: >-
        The single intake door (EDR-INTAKE-01 D1): submit an SBOM or a vulnerability
        report as the RAW body, with the metadata as query parameters.
      description: >
        The body IS the artifact — unwrapped, so `--data-binary @file` is the whole
        client and a 60 MB SBOM streams instead of being JSON-escaped into an
        envelope (see the change's design, "Why the body is raw and the metadata is
        query parameters"). `kind` and `format` are DETECTED from the body (D5a) and
        echoed back as `detected_kind` / `detected_format`.


        Every outcome is a receipt (D9): `201`/`200` when the work finished inline,
        `202` when it exceeded `THEMIS_INTAKE_INLINE_BUDGET` and continues
        server-side, and a refusal naming itself from the closed taxonomy (D11).
        `POST /evidence` is unchanged and remains the raw, release-id-only door.
      parameters:
        - name: release_id
          in: query
          description: The release this document is about, named directly. Wins over the triple.
          schema:
            type: string
        - name: product
          in: query
          description: >-
            With `project` and `version`, names the release by its triple — resolved
            READ-ONLY (D7). Intake never creates Registry identity.
          schema:
            type: string
        - name: project
          in: query
          schema:
            type: string
        - name: version
          in: query
          schema:
            type: string
        - name: create_release
          in: query
          description: >-
            With the WHOLE triple (`product`, `project`, `version`), find-or-create
            the Release instead of refusing an unknown version (EDR-INTAKE-01 B2).
            Rejected alongside `release_id` (`create_release_conflict`) and with an
            incomplete triple (`incomplete_release_triple`). Products and Projects
            are still resolved read-only — intake creates versions, never identity.
          schema:
            type: boolean
        - name: allow_without_sbom
          in: query
          description: >-
            D6's deliberate override: file a vulnerability report for a release with
            no SBOM-derived inventory. Recorded in provenance, so a release in that
            state says so.
          schema:
            type: boolean
        - name: kind
          in: query
          description: >-
            The kind the caller declares the body to be (D5a). Checked against the
            body, never obeyed over it: a body that cannot be the declared kind is
            `declared_format_mismatch`. A Nessus `.nessus` export is both, so this
            picks the road (2026-10-26 P1): omitted or `sbom` files its package list
            as the release's SBOM; `vuln-report` files its findings.
          schema:
            type: string
            enum: [sbom, vuln-report]
        - name: observed_at
          in: query
          description: >-
            RFC 3339 assertion about WHICH observation this is (D3). Omitted, the
            timestamp is derived from the submitted data; it is never the upload time.
            A Nessus CSV carries no scan date, so it needs this (2026-10-26 C3).
          schema:
            type: string
        - name: expected_checksum
          in: query
          description: >-
            Lowercase-hex SHA-256 of the SUBMITTED bytes. Verified at the border,
            because for a converted submission the filed bytes are not the submitted
            ones (D2).
          schema:
            type: string
        - name: provenance_source
          in: query
          description: Who produced the document — labeling only, never authority.
          schema:
            type: string
        - name: provenance_image_digest
          in: query
          schema:
            type: string
        - name: build_id
          in: query
          description: >-
            Which pipeline run produced this document — stored as artifact provenance
            and echoed on the receipt (EDR-INTAKE-01 B5). Deliberately inert: nothing
            reads it for dedup, correlation or current-SBOM selection. The bound is
            256 **Unicode code points**, not bytes, so the spec and the code count the
            same thing; over the bound or not valid UTF-8 is `build_id_invalid`,
            refused and never truncated.
          schema:
            type: string
            maxLength: 256
        - name: Idempotency-Key
          in: header
          description: >-
            Client-asserted retry identity (D12). The same key within the receipt TTL
            returns the ORIGINAL receipt instead of starting new work.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              description: The artifact itself — an SBOM, a vendor report, or a curated report.
          text/csv:
            schema:
              type: string
              description: A Cortex CSV export. CSV is a REQUEST encoding, never an evidence document (D2).
          application/xml:
            schema:
              type: string
              description: >-
                A Nessus `.nessus` export (root element `NessusClientData_v2`). Only vendor
                advisory checks with package lines become findings; every other result
                carrying a CVE is counted in `findings_skipped` (EDR-INTAKE-01, 2026-10-24
                amendment). Nothing about the scanned hosts is filed.
          application/octet-stream:
            schema:
              type: string
      responses:
        '201':
          description: Filed inline, a new evidence document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeReceipt'
        '200':
          description: >-
            Filed inline, resolving to the document already held — a byte-identical
            re-submission to the SAME release (D8). `created` is false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeReceipt'
        '202':
          description: >-
            Over the inline budget (D9): the receipt is returned immediately and the
            work continues server-side. Come back to `status_url`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeReceipt'
        '400':
          $ref: '#/components/responses/IntakeProblem'
        '401':
          $ref: '#/components/responses/IntakeProblem'
        '404':
          $ref: '#/components/responses/IntakeProblem'
        '409':
          $ref: '#/components/responses/IntakeProblem'
        '413':
          $ref: '#/components/responses/IntakeProblem'
        '415':
          $ref: '#/components/responses/IntakeProblem'
        '422':
          $ref: '#/components/responses/IntakeProblem'
        '500':
          description: >-
            Themis could not carry the attempt out — a statement about Themis, not
            about the document, so the receipt is `failed` and carries no reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeProblem'
        '503':
          description: >-
            The bounded intake backlog is full. Nothing was filed and NO receipt was
            created, so the whole request is safe to retry after `Retry-After`. This
            is a service condition, not a document refusal, so it carries no reason
            from the closed taxonomy.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /intake/{intakeId}:
    get:
      operationId: getIntakeReceipt
      summary: Get one intake attempt's receipt (D9) — every intake is addressable, including a refused one.
      parameters:
        - name: intakeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: >-
            The receipt as it stands. Terminal at `filed` — which does NOT claim
            correlation is complete; `next_checks` names who answers that (D10).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeReceipt'
        '404':
          $ref: '#/components/responses/Problem'
components:
  responses:
    Problem:
      description: Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    IntakeProblem:
      description: >-
        The intake refused the submission, by name. Nothing was filed — stages 1-6
        are side-effect-free, so the attempt leaves a `rejected` receipt and nothing
        else (D13).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntakeProblem'
  schemas:
    RegisterEvidenceRequest:
      type: object
      required: [kind, subject_release_id, document]
      properties:
        kind:
          type: string
          enum: [sbom, vex, scanner-report]
        format:
          type: string
          enum: [cyclonedx, spdx]
        spec_version:
          type: string
        subject_release_id:
          type: string
        expected_checksum:
          type: string
        provenance_source:
          type: string
        provenance_image_digest:
          type: string
        document:
          type: string
          description: The raw evidence document (UTF-8 text, e.g. an SBOM JSON).
    RegisterEvidenceResponse:
      type: object
      required: [id, created]
      properties:
        id:
          type: string
        created:
          type: boolean
    EvidenceFacts:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        subject_release_id:
          type: string
        fingerprint:
          type: string
        trust_status:
          type: string
        provenance_source:
          type: string
        provenance_image_digest:
          type: string
        filed_at:
          type: string
          format: date-time
    EvidenceSummary:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        fingerprint:
          type: string
        provenance_source:
          type: string
          description: >
            Who produced the document (e.g. the scanner tool name) — labeling only, never
            authority (EDR-GUI-01 D14). Empty when the uploader did not say.
        filed_at:
          type: string
          format: date-time
    Document:
      type: object
      required: [kind, document]
      properties:
        kind:
          type: string
          description: The evidence kind (sbom | vex | scanner-report).
        document:
          type: string
          description: The raw stored document bytes as UTF-8 text.
    Inventory:
      type: object
      properties:
        components:
          type: array
          items:
            $ref: '#/components/schemas/Component'
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/DependencyEdge'
    Component:
      type: object
      properties:
        purl:
          type: string
        name:
          type: string
        version:
          type: string
        ecosystem:
          type: string
        source:
          type: string
    DependencyEdge:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
        relationship:
          type: string
    Problem:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
        supported_formats:
          type: array
          items:
            type: string
    RejectReason:
      type: string
      description: >
        The CLOSED taxonomy of intake refusals (EDR-INTAKE-01 D11), identical to
        `internal/evidence/domain.RejectReason`. Adding a value is a contract change
        with a guard test: a consumer that knew 6 of 15 reasons reported "no reason
        given" for the other nine (#116).


        There is deliberately no `inventory_not_ready`: Evidence has no window in
        which it holds an SBOM whose inventory is pending, so the value could never
        fire, and a closed enum with a dead value is worse than no value (D6).


        The last four are the 2026-10-12 amendment's (B2/B4/B5 and its status-code
        table), appended so no existing value moves.
      enum:
        - unknown_release
        - no_inventory_for_release
        - unrecognised_format
        - declared_format_mismatch
        - malformed_body
        - source_invalid
        - schema_invalid
        - empty_report
        - observed_at_underivable
        - observed_at_invalid
        - conversion_failed
        - checksum_mismatch
        - duplicate_other_release
        - payload_too_large
        - too_many_records
        - unauthorized
        - create_release_conflict
        - incomplete_release_triple
        - ambiguous_name
        - build_id_invalid
    ReceiptStatus:
      type: string
      description: >-
        Where one intake attempt has got to (D9). The ladder is forward-only and its
        three terminals are `filed`, `rejected` and `failed`.
      enum: [accepted, validating, converting, registering, filed, rejected, failed]
    NextCheck:
      type: object
      description: >-
        Who answers "did the work land" (D10). The receipt is terminal at `filed` and
        does NOT claim correlation is complete — Knowledge owns correlation, and
        asking Evidence to poll it would invent the coupling the bus exists to avoid.
      required: [what, url]
      properties:
        what:
          type: string
          enum: [unresolved, posture]
        url:
          type: string
    IntakeReceipt:
      type: object
      description: >-
        The record of one intake attempt. Every intake is addressable, including a
        refused one: a rejected receipt is the thing that was missing on 2026-10-05.
      required: [intake_id, status, status_url]
      properties:
        intake_id:
          type: string
        status:
          $ref: '#/components/schemas/ReceiptStatus'
        reason:
          $ref: '#/components/schemas/RejectReason'
        detail:
          type: string
          description: >-
            The refusal's or failure's elaboration. NEVER concatenated with `reason`:
            a consumer switches on the reason and displays the detail (the 2026-09-22
            lesson).
        evidence_id:
          type: string
          description: The filed document's identity. Present only when the status is `filed`.
        created:
          type: boolean
          description: False when filing resolved to the document already held (a dedup, D8).
        release_id:
          type: string
          description: Empty when the attempt was refused before the release was resolved.
        detected_kind:
          type: string
          description: What the body was identified as (D5a) — `sbom` or `vuln-report`.
        detected_format:
          type: string
          description: The dialect (`spdx`, `cyclonedx`, `curated`, `trivy`, `grype`, `nessus`, `nessus-csv`, `cortex-json`, `cortex-csv`). A `nessus` SBOM is filed as the CycloneDX document it converts to.
        findings_total:
          type: integer
          description: >-
            Source records the conversion CONSIDERED. Reported beside
            `findings_skipped`, never alone: "427 of 427" and "427 of 500" must not
            look alike.
        findings_skipped:
          type: integer
        components:
          type: integer
          description: Components the filed SBOM's canonical inventory carries.
        components_skipped:
          type: integer
          description: >-
            Package lines a converted SBOM left out because no identity could be read
            for them (another vendor's package, an OS Themis does not map, a name that
            does not split) — EDR-INTAKE-01 2026-10-26 P4. Zero for an SBOM filed as
            submitted.
        components_unmanaged:
          type: integer
          description: >-
            Hand-installed components a converted SBOM filed beside the packages —
            software no package manager owns, found by the scanner's detection plugins
            under the EDR-INTAKE-01 2026-10-27 H1 rule (a path outside the rpm trees,
            no package mark, no RPM of that product). Zero for every other submission.
        source_digest:
          type: string
          description: Lowercase-hex SHA-256 of the SUBMITTED bytes (which, for a converted submission, are not the filed bytes).
        converted_by:
          type: string
          description: The converter and its version (`cortex@1`); empty for a pass-through.
        build_id:
          type: string
          description: >-
            The `build_id` THIS attempt submitted (B5). A receipt records an attempt
            and the evidence row records what was filed, so on a byte-identical retry
            — which dedups and keeps the FIRST upload's provenance — the two differ by
            design.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status_url:
          type: string
        retry_after_seconds:
          type: integer
          description: Present on a `202` — how long to wait before reading `status_url`.
        next_checks:
          type: array
          description: Present on a terminal `filed` receipt, and omitted entirely when the base URLs are unset — never a broken URL.
          items:
            $ref: '#/components/schemas/NextCheck'
    IntakeProblem:
      type: object
      description: >-
        A refusal, naming itself. `reason` and `detail` are TWO fields and are never
        concatenated (D9/D11).
      required: [title, status, detail]
      properties:
        title:
          type: string
        status:
          type: integer
        reason:
          $ref: '#/components/schemas/RejectReason'
        detail:
          type: string
        intake_id:
          type: string
          description: The receipt this refusal was recorded on — readable at `GET /intake/{intakeId}`.
