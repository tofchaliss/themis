openapi: 3.0.3
info:
  title: Themis Governance API
  version: 1.0.0
  description: >
    Governance context (Phase-3 greenfield) — the authority surface. Read Findings
    (release-scoped concerns) with their Enterprise Position history and Governance
    Proposals, and drive the governed decision workflow (raise / accept / reject a
    proposal, and Finding lifecycle transitions). AI and automation may propose only;
    accepting or rejecting requires an authorized human (or a Governance-owned policy).
servers:
  - url: /api/v1
paths:
  /findings:
    get:
      operationId: getFindingByKey
      summary: Get a Finding by its (Release, Faultline) business key.
      parameters:
        - name: release
          in: query
          required: true
          schema:
            type: string
        - name: faultline
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingView'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /findings/{id}:
    get:
      operationId: getFinding
      summary: Get a Finding by its identity (with Position history + Proposals).
      parameters:
        - $ref: '#/components/parameters/FindingId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingView'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /findings/{id}/position:
    get:
      operationId: getPosition
      summary: Get a Finding's current (or a specific) Enterprise Position version.
      parameters:
        - $ref: '#/components/parameters/FindingId'
        - name: version
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionView'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /findings/{id}/proposals:
    post:
      operationId: raiseProposal
      summary: Raise a Governance Proposal against a Finding (proposer only, no authority).
      parameters:
        - $ref: '#/components/parameters/FindingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RaiseProposalRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaiseProposalResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /findings/{id}/proposals/{proposalId}/accept:
    post:
      operationId: acceptProposal
      summary: Accept a proposal, establishing a new Enterprise Position (authorized decider only).
      parameters:
        - $ref: '#/components/parameters/FindingId'
        - $ref: '#/components/parameters/ProposalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '204':
          description: Accepted.
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /findings/{id}/proposals/{proposalId}/reject:
    post:
      operationId: rejectProposal
      summary: Reject a proposal (authorized decider only).
      parameters:
        - $ref: '#/components/parameters/FindingId'
        - $ref: '#/components/parameters/ProposalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '204':
          description: Rejected.
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /findings/{id}/resolve:
    post:
      operationId: resolveFinding
      summary: Close a Finding's concern (reopenable).
      parameters:
        - $ref: '#/components/parameters/FindingId'
      responses:
        '204':
          description: Resolved.
        '409':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /findings/{id}/reopen:
    post:
      operationId: reopenFinding
      summary: Reopen a Monitoring/Resolved Finding for further investigation.
      parameters:
        - $ref: '#/components/parameters/FindingId'
      responses:
        '204':
          description: Reopened.
        '409':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /findings/{id}/archive:
    post:
      operationId: archiveFinding
      summary: Archive a Finding (terminal — release retired).
      parameters:
        - $ref: '#/components/parameters/FindingId'
      responses:
        '204':
          description: Archived.
        '409':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /findings/{id}/commissions:
    post:
      operationId: commissionFinding
      summary: >-
        Commission governed AI-runtime work against a Finding BEFORE it runs (EDR-HARNESS-01
        D-C-1). An authenticated human authority act: records the exact method and deployment
        identities the runtime must execute under; changes no investigation stage. Returns the
        Themis-minted commission id the runtime carries verbatim.
      parameters:
        - $ref: '#/components/parameters/FindingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /findings/{id}/commissions/{commissionId}/withdraw:
    post:
      operationId: withdrawCommission
      summary: >-
        Withdraw a commission (forward-only, D-C-3). Historical executions under it stay
        inspectable evidence; future proposals citing it are refused.
      parameters:
        - $ref: '#/components/parameters/FindingId'
        - name: commissionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawCommissionRequest'
      responses:
        '204':
          description: Withdrawn.
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /findings/{id}/recommend:
    post:
      operationId: recommendPosition
      summary: On-demand — ask the Intelligence Gateway for an advisory position recommendation. Records an AI proposal (never auto-accepted); AI absence/failure yields 204.
      parameters:
        - $ref: '#/components/parameters/FindingId'
      responses:
        '201':
          description: An advisory AI proposal was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaiseProposalResponse'
        '204':
          description: No proposal (AI disabled, unavailable, or declined) — a safe outcome.
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /findings/{id}/assessment:
    get:
      operationId: getFindingAssessment
      summary: >
        Domain Projection - everything needed to assess one Finding: the release-scoped
        concern plus what is known about the CVE it rests on (EDR-TRUST-01 T10). Named for
        the business view, never for a consumer; a dashboard, a report and the AI Runtime all
        read the same projection. Deterministic and self-contained, so it replays as a test
        fixture. The knowledge half is best-effort - an unreachable Knowledge degrades to the
        Finding alone rather than failing the projection.
      parameters:
        - $ref: '#/components/parameters/FindingId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingAssessment'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /releases/{releaseId}/posture:
    get:
      operationId: getReleasePosture
      summary: List all Findings + current Positions for a Release (posture rollup).
      parameters:
        - name: releaseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostureEntry'
        '500':
          $ref: '#/components/responses/Problem'
  /releases/{releaseId}/upload-outcome:
    get:
      operationId: getReleaseUploadOutcome
      summary: >-
        What the Release's most recent new SBOM changed (EDR-REMEDIATION-01 D3) — new,
        reappeared, no longer present and unchanged, against the SBOM filed immediately before
        it. A report, never a state. 404 when no outcome has been stated for this Release yet.
      parameters:
        - name: releaseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadOutcome'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /releases/{releaseId}/compare/{candidateId}:
    get:
      operationId: compareReleases
      summary: >-
        Diff two releases' postures by CVE — fixed / new / persisting (EDR-GOVERNANCE-01 D16,
        IDEA-1's read half). "Fixed" is absence proven by new evidence, so the read refuses
        (422) when either release has no evidence filed, and refuses (502) when Evidence
        cannot be asked — it never fails open.
      parameters:
        - name: releaseId
          in: path
          description: The baseline release (the one that shipped).
          required: true
          schema:
            type: string
        - name: candidateId
          in: path
          description: The candidate release (the build that claims to fix things).
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseComparison'
        '422':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /events/release-evaluated:
    get:
      operationId: getReleaseEvaluatedEvents
      summary: >
        Cursor read of the release-evaluated event feed (EDR-DELIVERY-01 M2-4). Rows strictly
        after the `after` sequence, in sequence order; `limit` defaults to 100 and is clamped to
        500. At-least-once — a subscriber deduplicates on `event_id` and stores `next` as its
        cursor. Read scope.
      parameters:
        - name: after
          in: query
          required: false
          description: The sequence cursor; everything later than it is returned. Omitted = from the start.
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          description: Page size; default 100, values above 500 are clamped.
          schema:
            type: integer
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseEvaluatedEventsPage'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /metrics/remediation:
    get:
      operationId: getRemediationMetrics
      summary: >-
        Remediation metrics (EDR-REMEDIATION-01 D6), estate-wide and per Product: open Findings by
        age band and severity, the share within SLA and the number breached now, mean time to
        decision, and two remediation measures kept apart — time to remediation (creation to the
        first evaluated SBOM that no longer carried it, counted only when a person decided
        afterwards, D8 Q4) and time to resolution (creation to a person resolving it). Read scope.
      parameters:
        - name: product
          in: query
          required: false
          description: Keep only this Product (id or name, case-insensitive). The estate figures always cover everything.
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationReport'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /sla-policy:
    get:
      operationId: getSLAPolicy
      summary: >-
        The SLA policy (EDR-REMEDIATION-01 D1) - days to fix per severity bucket with an enforce
        switch, for the estate and any per-Product overrides. With nothing stored the estate
        reads the shipped defaults (7 / 30 / 90 / 180 days, all enforced). Read scope.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SLAPolicySet'
        '500':
          $ref: '#/components/responses/Problem'
    put:
      operationId: putSLAPolicy
      summary: >-
        Store the estate SLA policy (scope omitted or empty) or one Product's override (scope =
        the Product id). Admin scope only. A deadline already running for a Finding moves with
        the policy, because the due date is derived, never stored; the frozen severity bucket
        does not move (D8 Q1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SLAPolicyPut'
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SLAPolicyRecord'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /faultlines/{faultlineId}/blast-radius:
    get:
      operationId: getBlastRadius
      summary: List the Releases affected by a Faultline (blast-radius rollup).
      parameters:
        - name: faultlineId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    FindingId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
  responses:
    Problem:
      description: Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    FindingView:
      type: object
      properties:
        id:
          type: string
        release_id:
          type: string
        faultline_id:
          type: string
        cve:
          type: string
        stage:
          type: string
        components:
          type: array
          items:
            $ref: '#/components/schemas/Component'
        current_position:
          $ref: '#/components/schemas/PositionView'
        disposition_stale:
          $ref: '#/components/schemas/DispositionStale'
        positions:
          type: array
          items:
            $ref: '#/components/schemas/PositionView'
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/ProposalView'
        commissions:
          type: array
          description: >-
            Authority records for governed AI-runtime work against this Finding
            (EDR-HARNESS-01). Append-only; open or withdrawn. Never served to the runtime's
            model (the harness read door projects them out).
          items:
            $ref: '#/components/schemas/CommissionView'
    CommissionView:
      type: object
      properties:
        id: { type: string }
        skill: { type: string }
        composition_sha256: { type: string }
        anchor: { type: string }
        artifact_sha256: { type: string }
        commissioned_kind: { type: string }
        commissioned_id: { type: string }
        premise_stage: { type: string }
        premise_position_version: { type: integer }
        rationale: { type: string }
        raised_at: { type: string, format: date-time }
        state: { type: string, description: open | withdrawn }
        withdrawn_kind: { type: string }
        withdrawn_id: { type: string }
        withdrawn_at: { type: string, format: date-time }
        withdrawal_rationale: { type: string }
    CommissionRequest:
      type: object
      required: [skill, composition_sha256, anchor, artifact_sha256]
      properties:
        skill: { type: string, description: runtime method name@version (opaque to Themis) }
        composition_sha256: { type: string }
        anchor: { type: string, description: runtime deployment name@version (opaque to Themis) }
        artifact_sha256: { type: string }
        rationale: { type: string }
        actor_id:
          type: string
          description: >-
            DEVELOPMENT commissioner identity, used only when inbound auth is disabled (recorded
            with a `dev:` prefix). Ignored when the request is authenticated: the recorded actor
            is derived from the API key's principal as `key:<key-id>` (EDR-SECURITY-01 D10).
    CommissionResponse:
      type: object
      properties:
        commission_id: { type: string }
    WithdrawCommissionRequest:
      type: object
      properties:
        rationale: { type: string }
        actor_id: { type: string, description: DEVELOPMENT identity; ignored when authenticated. }
    HarnessExecutionEvidence:
      type: object
      description: >-
        harness-execution/v1 — the immutable evidence a proposal rests on when its basis is a
        commissioned AI-runtime execution (EDR-HARNESS-01 D-I-5). Every field was DERIVED by
        Themis's own intake CLI from the runtime record; Governance validates the shape and the
        correspondence to the cited commission, and never re-reads the runtime record.
      required: [commission_id, anchor_hash, anchor, anchor_state_at_intake, task_id, artifact_bound_seq, artifact_object_id, verified_member_path, verified_member_sha256, skill, skill_composition_sha256, contract, contract_sha256, contract_state_at_intake, reconstruction, production_witness, constitution_hash, harness_module, delegation_count, delegation_seqs, business_refs]
      properties:
        commission_id: { type: string }
        anchor_hash: { type: string }
        anchor: { type: string }
        anchor_state_at_intake: { type: string }
        task_id: { type: string }
        artifact_bound_seq: { type: integer, format: int64 }
        artifact_object_id: { type: string }
        verified_member_path: { type: string }
        verified_member_sha256: { type: string }
        skill: { type: string }
        skill_composition_sha256: { type: string }
        contract: { type: string }
        contract_sha256: { type: string }
        contract_state_at_intake: { type: string }
        reconstruction: { type: string, description: consistent-pass }
        production_witness: { type: string, description: l5-witnessed (Position-eligible) }
        constitution_hash: { type: string }
        harness_module: { type: string }
        delegation_count: { type: integer }
        delegation_seqs:
          type: array
          items: { type: integer, format: int64 }
        business_refs:
          type: array
          description: Identifiers from the RECORDED Finding bytes the execution read (dependency PURL, CVE); Business-Verified against the Finding.
          items: { type: string }
    DispositionStale:
      type: object
      description: >-
        Present when the current SUPPRESSING Position has been re-surfaced (EDR-GOVERNANCE-01
        D14, RF-2): its premise drifted (KEV, a public exploit, an EPSS rise) or its review-by
        date passed, and nobody has re-decided since. While present, residual_priority equals
        effective_priority — the Finding is back in the queue — and `reason` says why in words.
        A new accepted proposal clears it. Absent = not re-surfaced.
      required: [since, reason]
      properties:
        since:
          type: string
          format: date-time
        reason:
          type: string
    PositionView:
      type: object
      properties:
        version:
          type: integer
        stance:
          type: string
        rationale:
          type: string
        actor_kind:
          type: string
        actor_id:
          type: string
        accepted_proposal_id:
          type: string
        faultline_ref:
          type: string
        established_at:
          type: string
          format: date-time
        review_by:
          type: string
          format: date-time
          description: The date this decision asked to be revisited; absent when none was agreed.
        owner:
          type: string
          description: The accountable owner of an accepted risk (EDR-REMEDIATION-01 D2); absent when none.
        treatment:
          type: string
          enum: [accept, transfer, avoid, mitigate_later]
          description: How an accepted risk is handled (D2); absent when not stated.
        proof:
          type: string
          description: Reference (URL or document id) to the justification (D2). Stored as text, never fetched.
    ProposalView:
      type: object
      properties:
        id:
          type: string
        proposer_kind:
          type: string
        proposer_id:
          type: string
        stance:
          type: string
        rationale:
          type: string
        raised_at:
          type: string
          format: date-time
        status:
          type: string
        decided_kind:
          type: string
        decided_id:
          type: string
        commission_id:
          type: string
          description: The commission the cited execution ran under (EDR-HARNESS-01); empty for non-harness proposals.
        harness_evidence:
          $ref: '#/components/schemas/HarnessExecutionEvidence'
        evidence_trust:
          type: string
          description: >-
            The trust class of the evidence this proposal rests on (EDR-TRUST-01 T2/T3) —
            `observed`, `asserted` or `inferred`. It is the field the constitutional check (T4)
            turns on: an `inferred` proposal can never be auto-accepted by any policy.

            Surfaced because a human exercising the decision T4 reserves for them was shown two
            proposals that looked equally authoritative, with nothing to say that one rested on
            re-derivable fact and the other on a model's reasoning. A guarantee nobody can see is
            one nobody can act on. Additive/optional on v1 — an older client ignores it.
    FixedVersion:
      type: object
      properties:
        package:
          type: string
          description: The package the fix is published for — the SOURCE package for distro components.
        version:
          type: string
        ecosystem:
          type: string
          description: >-
            The world the fix is published in (rpm | apk | pypi | ...), as the feed stated it;
            empty when the source did not say. Carried so a consumer can pair each fix with the
            occurrence it actually applies to (EDR-VERDICT-01 D8 - "update the RPM" and
            "upgrade the pip install" are different work) without guessing from version shape.
    Component:
      type: object
      properties:
        purl:
          type: string
        name:
          type: string
        version:
          type: string
        ecosystem:
          type: string
        source:
          type: string
          description: >-
            The upstream SOURCE-package name for distro components (python3-pyyaml -> PyYAML); empty
            for non-distro. It is the only key that joins a component to its published fix, because
            feeds attribute fixes to the source package while a PURL carries the binary one, and
            neither is derivable from the other (AI-GROUND-1).
        claim_class:
          type: string
          description: >-
            Why this component matched (EDR-CORRELATION-01 D3): `carrier` - evidence says it carries
            the flaw; `scope` - it was in a distro advisory's rebuild set with no such evidence;
            empty - unknown, which every consumer treats as `carrier`.

            A module-stream advisory rebuilds every RPM in the stream and lists them all as
            affected, so without this a CPython flaw reads as a vulnerability of python3-pyyaml.
            The component is kept either way - replacing a superseded build is real work - but an
            upgrade plan and the AI's grounding use carriers only.
        detection_origin:
          type: string
          description: >-
            Which engine produced this match (KN-SCAN-2): `discovery` - feed correlation against
            the release inventory, including the re-discovery sweep; `scanner/<name>` - an
            uploaded scanner report (bare `scanner` when the report names no engine); empty -
            unknown (the match predates the field). Display provenance ONLY - it never enters a
            decision, a policy, or the AI's grounding; authority stays with the trust class and
            the source tier.
        verdict_state:
          type: string
          enum: [open, cleared_vendor_fix]
          description: >-
            The occurrence verdict, mirrored from Knowledge (EDR-VERDICT-01 D2/D5):
            `cleared_vendor_fix` - the installed build provably carries the vendor's fix;
            `open` or absent - a live occurrence (absent = the row predates the field, which
            reads as open - the fail-safe direction). This is the MACHINE's "handled"; a
            human's "handled" is the Position, and the two never mix.
        verdict_grade:
          type: string
          enum: [observed, inferred]
          description: >-
            Evidence strength behind a clearance (EDR-VERDICT-01 D3, EDR-TRUST-01 vocabulary):
            `observed` - direct evidence (the component's own version against the vendor bound,
            or an explicit SBOM ownership relationship); `inferred` - a same-inventory match
            Themis worked out itself, always labeled as such. Present only when cleared.
        verdict_reason:
          type: string
          description: >-
            Plain-language premise of the verdict (e.g. "vendor fix 0:39.2.0-9.el8_10 present"),
            stated by Knowledge and rendered verbatim - a clearance nobody can read the reason
            for is one nobody can audit.
    FindingAssessment:
      type: object
      properties:
        finding:
          $ref: '#/components/schemas/FindingView'
        knowledge:
          $ref: '#/components/schemas/FaultlineKnowledge'
        release_scope:
          type: object
          description: >-
            The RELEASE'S own product placement (EDR-VEX-02 D12), the side every vendor statement
            below was compared against: `enterprise-linux 8` for RHEL and its rebuilds, `alpine
            3.20`, `debian 12`. Absent when the release could not be placed (every statement then
            reads `not_comparable`). Lets a consumer fold statements about other product families
            and say "no statement covers this release" only when the vendor speaks about the
            release's own family.
          properties:
            family: { type: string }
            major: { type: string }
        vendor_statements:
          type: array
          description: >-
            The card's vendor VEX statements, each beside Themis's own determination of whether
            it covers THIS release (EDR-VEX-02 D2). Present so a BLOCKED statement still reaches
            the reviewer: a statement whose scope does not cover the release raises no Proposal,
            and without this it would vanish from the view rather than being visibly inapplicable.
          items:
            $ref: '#/components/schemas/VendorStatement'
        attribution:
          $ref: '#/components/schemas/Attribution'
    Attribution:
      type: object
      description: >-
        BOTH SIDES of the carrier question for this Finding (EDR-ATTRIBUTION-01 D10/D11/D14):
        what the card says carries the flaw, what is installed here, and whether Themis could
        relate the two. A read-time PROJECTION over facts both contexts already hold — no
        column, no event, nothing stored (D3). Absent when Knowledge's enrichment was
        unavailable when the projection was built.
      properties:
        status:
          type: string
          enum: [attributed, unresolved, no_components]
          description: >-
            `attributed` — at least one installed component acts as a carrier (unknown counts as
            carrier: absence of attribution evidence must never hide a live vulnerability).
            `unresolved` — the Attribution Gap: components ARE recorded and every one is
            scope-class, so nothing installed is evidenced to carry the flaw. An OBSERVATION
            about the evidence, never a verdict that the release is unaffected — the measured
            proof is a `requests` flaw whose only components are python3-ply and python3-pyyaml,
            legitimate bystanders every one.
            `no_components` — the Finding lists no components at all, which is not a gap.
        carriers:
          type: array
          description: >-
            The products the card's sources say carry the flaw, verbatim. EMPTY means no source
            named one, which is a materially different gap from "carrier named, none matched" —
            the two are counted apart deliberately.
          items: { type: string }
        components:
          type: array
          description: The installed components this Finding matched, by name — the other side.
          items: { type: string }
        unresolved_because:
          type: array
          description: >-
            Why the two sides could not be related, in plain language. Per-Finding DATA, and
            populated only when status is `unresolved`. What evidence would RESOLVE the gap is
            deliberately NOT here: it is identical on every instance, so it is documentation
            (EDR-ATTRIBUTION-01), and a field whose value never varies carries no information.
          items: { type: string }
    VendorStatement:
      type: object
      description: >-
        One vendor statement as EVIDENCE, beside Themis's separate conclusion. The three concepts
        never collapse into one field: `status`/`justification` are the vendor's own words,
        verbatim; `scope_family`/`scope_major` are the product the VENDOR said it covers; and
        `applicability` is Themis's determination. Nothing here rewrites the vendor's statement.
      properties:
        package: { type: string }
        status:
          type: string
          enum: [not_affected, affected, fixed, under_investigation, will_not_fix, fix_deferred, out_of_support]
          description: >-
            The VENDOR'S assertion, from the closed set (EDR-VEX-02 D13). Never carries Themis's
            conclusion. Only an applicable `not_affected` can have become a Proposal (D15); every
            other status is information for the engineer.
        justification:
          type: string
          description: The vendor's stated reason, verbatim.
        advisory:
          type: string
          description: On a `fixed` statement, the advisory that shipped the fix (D14). Absent otherwise.
        fixed_version:
          type: string
          description: On a `fixed` statement, the build the advisory shipped. Absent otherwise.
        scope_family:
          type: string
          description: Product family the vendor scoped it to, e.g. `enterprise-linux`. Empty = no readable scope.
        scope_major:
          type: string
          description: Major version of that family, e.g. `8`. Empty = no readable scope.
        covers_component:
          type: boolean
          description: >-
            The SECOND facet the raise rule asks (EDR-VEX-02 D23): whether the statement's
            `package` is one of this Finding's components, by the same test the raise uses. An
            `applicable` statement with `covers_component: false` applies to the release and is
            about another package — it clears nothing here and was never proposed.
        applicability:
          type: string
          enum: [applicable, not_applicable, unknown, not_comparable]
          description: >-
            THEMIS'S determination for this release's PRODUCT SCOPE. Only `applicable` can have
            become a Proposal — and only when `covers_component` is also true; every other value
            is non-clearing.
            `not_applicable` — the vendor's scope was positively established and does not cover
            this release. A product mismatch, never uncertainty.
            `unknown` — the VENDOR'S STATEMENT could not be placed: no CPE, or one that cannot be
            classified. A feed-quality gap from which nothing follows.
            `not_comparable` — the vendor's scope WAS placed, but this RELEASE could not be, so
            no comparison is possible. The measured case is a Maven or PyPI component, which
            carries no distribution build, against a perfectly clear Red Hat product scope.
            The last two were one value until 2026-09-21, and separating them is the point: a
            reviewer dismisses "the vendor spoke about a builder image and this is a Java
            library" instantly, while an unreadable CPE permits no conclusion at all. Because
            `not_comparable` describes the release rather than the statement, it appears
            identically on EVERY statement of an affected Finding — that repetition is the
            signal.
    FaultlineKnowledge:
      type: object
      description: >
        What Knowledge knows about the CVE, read over its read API. Absent fields mean the
        enrichment was unavailable when the projection was built.
      properties:
        faultline_id: { type: string }
        cve: { type: string }
        summary:
          type: string
          description: >-
            The winning source's short account of WHAT the CVE is, carried from Knowledge's
            reconciled view — so the human judging a proposal and the AI grounding on this
            projection read the same sentence. Descriptive only; nothing decides on it.
        severity: { type: string }
        cvss_score: { type: number }
        epss: { type: number }
        kev: { type: boolean }
        exploit_public: { type: boolean }
        affected_ranges:
          type: array
          items: { type: string }
        carrier_products:
          type: array
          description: >-
            The products the card's sources say CARRY the flaw (EDR-CORRELATION-01 D4), read from
            Knowledge unchanged. Governance classifies nothing with them — Knowledge already
            matched this Finding's components against exactly this list and the result is each
            component's claim class. See `attribution` for the derived, per-Finding answer.
          items: { type: string }
        fixed_versions:
          type: array
          description: >-
            Fix versions published for THIS Finding's components — selected from the card, not the
            card's flat cross-package union (EDR-TRUST-01 T9). Empty when the card holds fixes that
            cannot be attributed to this component; see unattributed_fixes.
          items: { type: string }
        fixes:
          type: array
          description: The same selection with package attribution intact.
          items:
            type: object
            properties:
              package: { type: string }
              version: { type: string }
        unattributed_fixes:
          type: integer
          description: >-
            How many of the card's fix versions could NOT be tied to this Finding's components.
            Non-zero with an empty fixed_versions means "fixes exist but none is attributable
            here" — materially different from "no fix published", and the two must not be
            confused by a consumer.
        range_trust:
          type: string
          enum: [observed, asserted, inferred]
          description: Trust class of the sources contributing the ranges (EDR-TRUST-01 T2/T3).
    ReleaseComparison:
      type: object
      description: >-
        The cross-release posture diff (D16). fixed rows carry the BASELINE's state (a fix
        closes the question forward, it never rewrites history); new and persisting carry the
        CANDIDATE's. Each bucket is sorted by residual_priority then effective_priority,
        descending.
      properties:
        baseline_release_id:
          type: string
        candidate_release_id:
          type: string
        fixed:
          type: array
          items:
            $ref: '#/components/schemas/PostureEntry'
        new:
          type: array
          items:
            $ref: '#/components/schemas/PostureEntry'
        persisting:
          type: array
          items:
            $ref: '#/components/schemas/PostureEntry'
    ReleaseEvaluatedEventsPage:
      type: object
      required: [items, next]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseEvaluatedEvent'
        next:
          type: integer
          format: int64
          description: The cursor for the following call — the last item's seq, or the caller's own cursor when the page is empty.
    ReleaseEvaluatedEvent:
      type: object
      required: [seq, event_id, name, occurred_at, body]
      properties:
        seq:
          type: integer
          format: int64
        event_id:
          type: string
          description: The bus envelope id of the same fact — the subscriber's dedup key.
        name:
          type: string
          description: governance.release_evaluated
        occurred_at:
          type: string
          format: date-time
        body:
          type: object
          additionalProperties: true
          description: The governance.release_evaluated.v1 payload exactly as published.
    UploadOutcome:
      type: object
      required: [sbom_id, evaluated_at, new, reappeared, no_longer_present, unchanged, not_judged, has_baseline]
      properties:
        sbom_id:
          type: string
          description: The SBOM this outcome describes.
        evaluated_at:
          type: string
          format: date-time
        new:
          type: integer
        reappeared:
          type: integer
        no_longer_present:
          type: integer
          description: Open Findings none of whose components is in this SBOM. They stay open with their Positions.
        unchanged:
          type: integer
        not_judged:
          type: integer
          description: Findings in neither SBOM (e.g. from a scanner report), or resolved / archived.
        new_cves:
          type: array
          items:
            type: string
        reappeared_cves:
          type: array
          items:
            type: string
        no_longer_present_cves:
          type: array
          items:
            type: string
        has_baseline:
          type: boolean
          description: False on the Release's first SBOM, where everything present is new.
    MeanDays:
      type: object
      required: [mean_days, count]
      properties:
        mean_days:
          type: number
        count:
          type: integer
          description: How many Findings the mean is over; 0 means no sample (mean_days is then 0).
    RemediationMetrics:
      type: object
      required: [scope, open, open_by_age, sla_applicable, within_sla, breached_now, within_sla_share, time_to_decision, time_to_remediation, time_to_resolution]
      properties:
        scope:
          type: string
          description: The Product name; empty for the estate.
        open:
          type: integer
        open_by_age:
          type: object
          description: Age band (0-7, 8-30, 31-90, over-90 days) to severity bucket to count.
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
        sla_applicable:
          type: integer
        within_sla:
          type: integer
        breached_now:
          type: integer
        within_sla_share:
          type: number
        time_to_decision:
          $ref: '#/components/schemas/MeanDays'
        time_to_remediation:
          $ref: '#/components/schemas/MeanDays'
        time_to_resolution:
          $ref: '#/components/schemas/MeanDays'
    RemediationReport:
      type: object
      required: [estate, products, products_unavailable, unattributed, generated_at]
      properties:
        generated_at:
          type: string
          format: date-time
        estate:
          $ref: '#/components/schemas/RemediationMetrics'
        products:
          type: array
          items:
            $ref: '#/components/schemas/RemediationMetrics'
        products_unavailable:
          type: boolean
          description: The Registry could not be read; only the estate figures are given.
        unattributed:
          type: integer
          description: Findings whose release the Registry estate does not list.
    SLATarget:
      type: object
      required: [days, enforce]
      properties:
        days:
          type: integer
          minimum: 0
          description: Days to fix, counted from the start of the SLA period.
        enforce:
          type: boolean
          description: When false the bucket has no deadline (state not_applicable).
    SLAPolicyPut:
      type: object
      required: [critical, high, medium, low, updated_by]
      properties:
        scope:
          type: string
          description: Empty or omitted = the estate policy; otherwise the Product id this override is for.
        critical:
          $ref: '#/components/schemas/SLATarget'
        high:
          $ref: '#/components/schemas/SLATarget'
        medium:
          $ref: '#/components/schemas/SLATarget'
        low:
          $ref: '#/components/schemas/SLATarget'
        updated_by:
          type: string
          description: The person changing the policy, recorded beside it.
    SLAPolicyRecord:
      type: object
      required: [scope, critical, high, medium, low]
      properties:
        scope:
          type: string
        critical:
          $ref: '#/components/schemas/SLATarget'
        high:
          $ref: '#/components/schemas/SLATarget'
        medium:
          $ref: '#/components/schemas/SLATarget'
        low:
          $ref: '#/components/schemas/SLATarget'
        updated_at:
          type: string
          format: date-time
          description: Absent for the shipped defaults (nothing stored yet).
        updated_by:
          type: string
    SLAPolicySet:
      type: object
      required: [estate, overrides]
      properties:
        estate:
          $ref: '#/components/schemas/SLAPolicyRecord'
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/SLAPolicyRecord'
    SLAAcceptancePeriod:
      type: object
      required: [start, position_version]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
          description: Absent while the acceptance still holds.
        position_version:
          type: integer
    SLAStatus:
      type: object
      description: >-
        The Finding's remediation clock (EDR-REMEDIATION-01 D1). Derived on every read, never
        stored; a breach changes nothing about the Finding (S1). Restarting after an acceptance
        never hides elapsed time: age_days and days_under_acceptance count from creation (S2).
      required: [state, bucket, bucket_changed, period_start, kev_due_applied, age_days, days_under_acceptance]
      properties:
        state:
          type: string
          enum: [within, due_soon, breached, paused, met, missed, not_applicable]
          description: >-
            within / due_soon (inside 7 days) / breached while running; paused under a valid
            accepted_risk or deferred Position; met / missed once a not_affected or mitigated
            Position, or the resolved / archived stage, stopped it; not_applicable with no
            severity and no CISA date, or an unenforced bucket.
        bucket:
          type: string
          description: The severity bucket frozen when the Finding first had a score (D8 Q1).
        current_bucket:
          type: string
          description: Today's bucket from the current base score.
        bucket_changed:
          type: boolean
          description: Severity changed since the clock started; the deadline still follows `bucket`.
        period_start:
          type: string
          format: date-time
        due:
          type: string
          format: date-time
          description: Absent when paused or not applicable.
        days_left:
          type: integer
          description: Whole days to `due`; negative when breached.
        kev_due_applied:
          type: boolean
          description: CISA's KEV due date was earlier than the policy's and is the deadline.
        stopped_at:
          type: string
          format: date-time
        age_days:
          type: integer
          description: Whole days since the Finding was created.
        days_under_acceptance:
          type: integer
          description: Whole days spent under a valid acceptance, all periods summed.
        acceptance_periods:
          type: array
          items:
            $ref: '#/components/schemas/SLAAcceptancePeriod'
    PostureEntry:
      type: object
      properties:
        finding_id:
          type: string
        faultline_id:
          type: string
        cve:
          type: string
        stage:
          type: string
        stance:
          type: string
        has_position:
          type: boolean
        position_version:
          type: integer
          description: >-
            The current Position's version when has_position (absent/0 otherwise) - the handle a
            release-scoped snapshot records so its staleness is exactly computable
            (EDR-COMMUNICATION-01 D13.2).
        position_rationale:
          type: string
          description: >-
            The current Position's own rationale (absent when none) - carried onto a release
            rollup's statements as status notes (EDR-COMMUNICATION-01 D13).
        disposition_stale:
          $ref: '#/components/schemas/DispositionStale'
        sla:
          $ref: '#/components/schemas/SLAStatus'
        components:
          type: array
          description: >-
            The release components this Finding was opened for, each carrying the SOURCE package a
            fix is published under. Present on the rollup so a release-scoped consumer can group by
            "what do I upgrade" without one read per Finding (EDR-TRUST-01 T10 — the projection is
            a reusable business view, and the grouping is a GROUP BY, not reasoning).
          items:
            $ref: '#/components/schemas/Component'
        band:
          type: string
          description: >-
            Knowledge's EXPLOITABILITY band (critical | high+ | high | elevated | informational) —
            not raw CVSS. `critical` means CVSS>=9 AND KEV-listed; `high+` means CVSS>=9 with a
            public exploit. Carried here so "which of these are critical?" is one read (DASH-2)
            rather than one Knowledge call per Faultline.
        fixes:
          type: array
          description: >-
            Fix versions published for THIS Finding's own components — selected, never the card's
            cross-package union, which is what led a recommendation to cite another package's
            version (AI-GROUND-1). Empty means none is attributable to these components.
          items:
            $ref: '#/components/schemas/FixedVersion'
        base_score:
          type: integer
          description: CVE-intrinsic composite priority (0-100), from Knowledge (C6).
        blast_multiplier:
          type: number
          description: Enterprise blast-radius amplification (1.0-2.0x) from the estate graph (C2); 1.0 when the estate is empty/unreachable.
        effective_priority:
          type: integer
          description: >
            base_score x blast_multiplier - how bad this is here, INDEPENDENT of what was decided
            about it (EDR-GOVERNANCE-01 D14). NOT clamped (D17/GOV-15): a ranking number, not a
            percentage - range 0-200 (multiplier saturates at 2.0x). A clamp is not
            order-preserving, and at a saturated estate it flattened every base >= 50 to 100.
        residual_priority:
          type: integer
          description: >
            effective_priority x stance_weight(stance) - the number to SORT a triage queue by
            (D14). Unclamped like effective_priority (D17); weight <= 1.0 keeps it <= effective.
            not_affected and accepted_risk weigh 0, mitigated 0.5 (configurable), deferred 0.9,
            and affected / under_investigation / no-position 1.0. A dispositioned Finding drops
            out of the queue without losing the intrinsic severity that effective_priority still
            reports.
        reservation:
          type: string
          enum: [asserted, inferred]
          description: >
            Trust class of the evidence the current Position rested on, when weaker than
            'observed' (EDR-TRUST-01 T12) - e.g. an acceptance leaning on a vendor's Asserted
            not_affected. Absent means no Position, or one resting on observed evidence.
            Derived from the accepted proposal, never stored as state.
        open_carriers:
          type: integer
          description: >
            How many CARRIER occurrences are still open (EDR-VERDICT-01 D7) - the number that
            decides queue membership. Scope-class rows never count. When components exist and
            this reads 0, every carrier is cleared by a vendor fix and effective_priority /
            residual_priority read 0 - the Finding has left the ranked queue without any row
            being deleted. One live carrier keeps FULL urgency however many cleared rows sit
            beside it: priorities are never discounted proportionally.
    RaiseProposalRequest:
      type: object
      required: [stance]
      properties:
        stance:
          type: string
        rationale:
          type: string
        proposer_kind:
          type: string
          description: human | ai (defaults to human). system/policy are internal only.
        proposer_id:
          type: string
        evidence:
          $ref: '#/components/schemas/HarnessExecutionEvidence'
        evidence_trust:
          type: string
          description: >-
            With `evidence`: the trust class the intake DERIVED from the execution facts
            (always `inferred` for harness-execution/v1). Governance refuses a class other than
            the derived one (D-I-5) — trust is a property of evidence, never an assertion.
    RaiseProposalResponse:
      type: object
      properties:
        proposal_id:
          type: string
    DecisionRequest:
      type: object
      required: [actor_id]
      properties:
        actor_id:
          type: string
          description: >-
            The DEVELOPMENT decider identity, used only when inbound auth is disabled, where it is
            recorded with a `dev:` prefix marking it unverified. When the request is
            authenticated it is IGNORED and the recorded actor is derived from the API key's
            principal as `key:<key-id>` — a value the server cannot verify must never overwrite
            one it can (EDR-SECURITY-01 D10). The `dev:` marker is applied to whatever arrives, so
            sending `key:…` yields `dev:key:…` and cannot forge authenticated provenance.
        actor_kind:
          type: string
          description: human (default). Only a human decider is accepted via the API.
        review_by:
          type: string
          format: date-time
          description: >-
            Optional review-by date for a SUPPRESSING decision (not_affected / accepted_risk). When
            set, the disposition sweep re-surfaces the Finding once it passes — the time-based
            counterpart to signal drift (GOV-14b). An accepted risk with no signal movement is not
            thereby still acceptable: the compensating control may be gone, the component may have
            moved, the person who accepted it may have left. Absent means NO date was agreed, which
            is not the same as "never expires" — nothing invents a deadline the decider did not set.
            Fourteen days before it, governance.review_due_soon.v1 is announced once.
        owner:
          type: string
          description: >-
            The accountable owner of the risk (EDR-REMEDIATION-01 D2) — often not the person
            accepting it. REQUIRED when a person accepts an accepted_risk proposal (D8 Q3; 400
            otherwise). Allowed only on accepted_risk and deferred.
        treatment:
          type: string
          enum: [accept, transfer, avoid, mitigate_later]
          description: How the accepted risk is being handled (D2). Allowed only on accepted_risk and deferred.
        proof:
          type: string
          description: >-
            A reference (URL or document id) to the justification (D2). Stored as text, never
            fetched. Allowed only on accepted_risk and deferred. Changing the owner, treatment or
            proof later is a new Position version: raise a proposal with the same stance and
            accept it with the new terms.
    Problem:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
