openapi: 3.0.3
info:
  title: Themis Knowledge API
  version: 1.0.0
  description: >
    Knowledge context (Phase-3 greenfield) — read the enterprise Faultline cards (the
    reconciled view + source-proposal provenance) and the affected-releases rollup.
    Read-only: cards evolve via feeds/correlation, not this API.
servers:
  - url: /api/v1
paths:
  /faultlines:
    get:
      operationId: getFaultlineByCVE
      summary: Get a Faultline by canonical CVE.
      parameters:
        - name: cve
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaultlineView'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /faultlines/by-advisory:
    get:
      operationId: getFaultlinesByAdvisory
      summary: >
        The cards whose vendor statements carry an advisory id (EDR-INCIDENT-01 D2), in CVE
        order. The alias is the `advisory` of a `fixed` statement (EDR-VEX-02 D14), so an
        advisory Themis has not seen on any card is an empty list - a Watch then says
        "unknown" rather than guessing. 503 when the lookup is not wired.
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FaultlineView'
        '400':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /faultlines/recent:
    get:
      operationId: getRecentFaultlines
      summary: >
        The newest CARDED Faultlines by card-creation time, newest first (GUI-16). A pure read
        over the estate's own cards — never a mirror of the world's CVE feed (EDR-KNOWLEDGE-01
        D5). `limit` defaults to 50 and is clamped at 200.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecentFaultline'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /faultlines/published-recently:
    get:
      operationId: getPublishedRecently
      summary: >
        CVEs the world published in the last `days` days (default 7, clamped at 30), fetched LIVE
        from the per-CVE source and shown, never stored (GUI-16 layer 2; "Gathering Is Not
        Knowing", EDR-KNOWLEDGE-01 D5). Each row says whether the estate already holds a card; an
        operator's gather on a row is the one act that creates one. 503 when no source is wired.
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublishedCVE'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /psirt/alerts:
    get:
      operationId: getPSIRTAlerts
      summary: >
        The PSIRT early alert (EDR-PSIRT-01 P2): CVEs the world published in the last `days` days
        (default 7, clamped at 30) with an original (source) score at or above `min_severity`
        (critical | high | medium | low; default high), each with the product components it MAY
        hit by name match (Q1; version ignored). Read LIVE from NVD, gaps filled from CVE.org,
        stored nowhere (EDR-KNOWLEDGE-01 D5). No Themis score: the team assesses after the alert
        and the engine decides. Unscored CVEs are not listed. 503 when no source is wired; 502
        when the world source fails.
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
        - name: min_severity
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PSIRTAlerts'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /psirt/bulletins:
    get:
      operationId: listBulletins
      summary: >
        The PSIRT bulletin register (EDR-PSIRT-01 revision 3): every live bulletin, newest report
        date first. A bulletin is what an admin wrote about an issue (an id, a title, links, a
        note, at most one CVE), so storing it keeps EDR-KNOWLEDGE-01 D5. 503 when no register is
        wired on this node.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bulletin'
        '503':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createBulletin
      summary: >
        Add a bulletin (admin only, R2). The report date defaults to today. 400 on invalid input,
        403 for a non-admin key, 409 when a live bulletin already has this bulletin ID or CVE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulletinInput'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bulletin'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /psirt/bulletins/{id}:
    put:
      operationId: updateBulletin
      summary: >
        Replace a bulletin's fields (admin only). An absent report date keeps the one it had.
        The change is kept in the bulletin's history.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulletinInput'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bulletin'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: removeBulletin
      summary: >
        Remove a bulletin from the register (admin only). It is a tombstone: its history stays
        readable.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed.
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /psirt/bulletins/{id}/history:
    get:
      operationId: getBulletinHistory
      summary: Every change of one bulletin, oldest first, a removed one included.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BulletinChange'
        '503':
          $ref: '#/components/responses/Problem'
  /faultlines/{id}:
    get:
      operationId: getFaultlineById
      summary: Get a Faultline by its identity.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaultlineView'
        '404':
          $ref: '#/components/responses/Problem'
  /faultlines/{id}/releases:
    get:
      operationId: getFaultlineReleases
      summary: List the releases affected by a Faultline (rollup projection).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /faultlines/{id}/ratings:
    get:
      operationId: getFaultlineRatings
      summary: Source CVSS ratings of a Faultline's CVE, one row per publication (EDR-SCORING-01 S2).
      description: >
        Source truth only. Every publication any source carried for this CVE, with its derived
        status (active, superseded, withdrawn), Themis's own validation of its vector, and its
        assessment identity under the latest grouping. Nothing here is selected or decided;
        selection belongs to Governance. 503 when this node records no ratings.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRatings'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /faultlines/gather:
    post:
      operationId: gatherCVE
      summary: On-demand fetch of ONE CVE's facts through the wired per-CVE sources (G-AI-1).
      description: >-
        The explicit, operator-triggered half of "the AI asks, the feeds gather": consults each
        wired per-CVE source (NVD, and Red Hat's Security Data since EDR-INCIDENT-01 D4 — so
        today's advisory bounds reach a card now, not after the next sweep) for a CVE the
        scheduled feeds may not have ingested
        yet, and folds what they return as ORDINARY source Proposals - same ACLs, same
        reconciliation precedence, same "Gathering Is Not Knowing" boundary as any feed. Unlike
        the scheduled sweeps this needs no enable flag: the authenticated POST is the opt-in.
        A write-scoped key is required (it records Proposals).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cve]
              properties:
                cve:
                  type: string
                  description: The CVE id to gather (e.g. CVE-2026-12345).
      responses:
        '200':
          description: >-
            The gather ran; each wired source reports found / recorded / withdrawn / error
            independently. found=false everywhere is an honest answer (the world has nothing
            yet), not a failure.
          content:
            application/json:
              schema:
                type: object
                required: [cve, sources]
                properties:
                  cve:
                    type: string
                  faultline_id:
                    type: string
                    description: The card the facts folded into, when one exists after the gather.
                  sources:
                    type: array
                    items:
                      type: object
                      required: [source]
                      properties:
                        source: { type: string }
                        found: { type: boolean }
                        recorded: { type: boolean, description: "a NEW Proposal folded; a restatement reads false" }
                        withdrawn: { type: boolean }
                        error: { type: string, description: "per-source failure - reported, never fatal to the gather" }
        '400':
          $ref: '#/components/responses/Problem'
        '503':
          description: No per-CVE source is wired on this node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /feeds:
    get:
      operationId: getFeedHealth
      summary: Tier-aware feed-health snapshot (signals_stale flag + per-feed status).
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedHealthReport'
  /sanity:
    get:
      operationId: getSanityFlags
      summary: The fan-out guard's standing flags (KN-SANITY-1).
      description: >-
        Components whose discovery answered a version Themis cannot parse with at least the
        configured number of distinct CVEs — the shape of a false-positive class. Measurements
        with a name on them; nothing here was dropped or decided. Empty with header
        `X-Themis-Sanity: not-wired` when the guard is not configured.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SanityFlag'
  /scanner-reports/{evidenceId}/unresolved:
    get:
      operationId: getUnresolvedComponents
      summary: Components a scanner report NAMED but whose identity could not be established.
      description: >-
        EDR-IDENTITY-01 D6. An observation whose purl is absent or unusable is resolved onto the
        release's own component when exactly one matches by name+version; anything else abstains
        and is reported here. These observations do NOT reach the Governance posture, so they are
        neither findings nor bystanders — they are evidence Themis holds and cannot yet identify.


        Recomputed on demand from immutable evidence rather than stored: D5 deliberately keeps the
        observed identifier out of Knowledge's rows, so this reads the report and the release
        inventory back through the SAME code path the ingest uses. The answer therefore cannot
        drift from the behaviour it describes.
      parameters:
        - name: evidenceId
          in: path
          required: true
          description: The scanner-report evidence id returned by the upload.
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnresolvedComponentsReport'
        '404':
          description: No such evidence document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The document is not a scanner report, so it has no observations to resolve.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/Problem'
components:
  responses:
    Problem:
      description: Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    PublishedCVE:
      type: object
      required: [cve, published, carded]
      properties:
        cve:
          type: string
        published:
          type: string
          format: date-time
        summary:
          type: string
        severity:
          type: string
        cvss_score:
          type: number
        carded:
          type: boolean
          description: Whether the estate already holds a card for this CVE.
        modified:
          type: string
          format: date-time
          description: >-
            When the source last changed its record (NVD lastModified). Absent when the source
            states none; never the time Themis fetched it (EDR-PSIRT-01 P1).
        cwes:
          type: array
          items:
            type: string
          description: >-
            The CWE ids the source states for the flaw, normalized ("CWE-787"), sorted by number.
            NVD placeholders such as NVD-CWE-noinfo are not CWE ids and are left out.
        issue_type:
          type: string
          description: >-
            A short issue-type word from Themis's fixed CWE table (EDR-PSIRT-01 choice 6, table
            version in issue_type_table), for example "Code execution" or "Denial of service";
            "Other" for CWEs the table does not map. Absent when the source states no CWE. A display
            label only: nothing decides on it. Always show the cwes beside it.
        issue_type_table:
          type: string
          description: The version of the CWE-to-issue-type table that produced issue_type.
        affected_products:
          type: array
          items:
            type: string
          description: >-
            The application products the source says carry the flaw (NVD CPE application parts).
            Empty for a record NVD has not analysed yet. The PSIRT alert matches these names
            against product component names (EDR-PSIRT-01 Q1).
    PSIRTAlerts:
      type: object
      required: [alerts, estate_unavailable, lookups_skipped, older_not_read, issue_type_table]
      properties:
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/PSIRTAlert'
        estate_unavailable:
          type: boolean
          description: >-
            The product inventory could not be read (Registry or Evidence unreachable, or not
            wired). Rows are still listed, but none carries matches, so the page must not read
            "no product hit".
        lookups_skipped:
          type: integer
          description: >-
            Rows that needed a CVE.org lookup (NVD had no score or no affected names) beyond the
            per-read cap; those rows are shown as NVD gave them.
        older_not_read:
          type: integer
          description: >-
            The oldest CVEs of the window that were not read, because the window holds more
            than the read's page budget. The read keeps the newest, which an alert is about.
        issue_type_table:
          type: string
          description: The version of the CWE-to-issue-type table behind every issue_type.
    PSIRTAlert:
      type: object
      required: [cve, published, original_score, original_severity, score_source, carded, matches]
      properties:
        cve:
          type: string
        published:
          type: string
          format: date-time
        modified:
          type: string
          format: date-time
          description: The source's last change; absent when not stated.
        summary:
          type: string
        original_score:
          type: number
          description: The highest source CVSS Base score seen (owner choice A).
        original_severity:
          type: string
          description: The CVSS qualitative rating of original_score.
        score_source:
          type: string
          description: Where original_score came from (nvd | cve.org).
        cwes:
          type: array
          items:
            type: string
        issue_type:
          type: string
          description: Short issue-type word from the fixed CWE table; absent when no CWE is stated.
        affected_products:
          type: array
          items:
            type: string
          description: The normalized affected names the match used (NVD CPE products, CVE.org CNA affected).
        matches:
          type: array
          items:
            $ref: '#/components/schemas/PSIRTMatch'
          description: The product components the CVE may hit. Empty means no name matched, never "not affected".
        carded:
          type: boolean
          description: Whether the estate already holds a card for this CVE (it is already in the engine).
        bulletin:
          $ref: '#/components/schemas/BulletinRef'
    BulletinInput:
      type: object
      required: [bulletin_id, title]
      properties:
        bulletin_id:
          type: string
          description: The team's bulletin number (at most 64 characters).
        title:
          type: string
          description: At most 300 characters.
        bulletin_url:
          type: string
          description: The bulletin's page (an absolute http or https link), or empty.
        alert_url:
          type: string
          description: The TSN or alert page (an absolute http or https link), or empty.
        note:
          type: string
          description: Free text, at most 4000 characters.
        cve:
          type: string
          description: The one CVE the bulletin is about, or empty for a risk with no CVE.
        report_date:
          type: string
          format: date
          description: The day it was reported; absent means today on a create, unchanged on an edit.
    Bulletin:
      type: object
      required: [id, bulletin_id, title, bulletin_url, alert_url, note, cve, report_date, type,
        created_at, created_by, updated_at, updated_by]
      properties:
        id:
          type: string
        bulletin_id:
          type: string
        title:
          type: string
        bulletin_url:
          type: string
        alert_url:
          type: string
        note:
          type: string
        cve:
          type: string
        report_date:
          type: string
          format: date
        type:
          type: string
          description: Derived (R6), never typed. Vulnerability when a CVE is given, Risk when not.
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
    BulletinChange:
      type: object
      required: [at, actor, action]
      properties:
        at:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
          description: created | updated | removed.
        before:
          $ref: '#/components/schemas/Bulletin'
        after:
          $ref: '#/components/schemas/Bulletin'
    BulletinRef:
      type: object
      required: [id, bulletin_id, title, bulletin_url]
      properties:
        id:
          type: string
        bulletin_id:
          type: string
        title:
          type: string
        bulletin_url:
          type: string
    PSIRTMatch:
      type: object
      required: [product_id, product_name, component, matched_on]
      properties:
        product_id:
          type: string
        product_name:
          type: string
        component:
          type: string
        matched_on:
          type: string
          description: >-
            What tied the CVE to the component: "themis" when the Themis engine already filed it
            against a release of the product (exact, version-aware); otherwise the affected name
            that matched ("vendor:product" for a match on a path's last segment).
    RecentFaultline:
      type: object
      required: [created_at, card]
      properties:
        created_at:
          type: string
          format: date-time
          description: When the card was created — the moment the CVE entered the estate's knowledge.
        card:
          $ref: '#/components/schemas/FaultlineView'
    FaultlineView:
      type: object
      properties:
        id:
          type: string
        cve:
          type: string
        stage:
          type: string
        view:
          $ref: '#/components/schemas/EnterpriseView'
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/ProposalProvenance'
    EnterpriseView:
      type: object
      properties:
        severity:
          type: string
        summary:
          type: string
          description: >-
            The winning source's short account of WHAT this vulnerability is (e.g. NVD's English
            description or OSV's summary), chosen by the same precedence rule as the headline
            severity but in an independent race. Bounded at ingestion. Descriptive only — no
            verdict consumes it, and it carries no trust class for exactly that reason.
        summary_source:
          type: string
          description: Which source won the summary (explainability, mirrors severity_source).
        cvss_score:
          type: number
        cvss_vector:
          type: string
        severity_source:
          type: string
        affected_ranges:
          type: array
          items:
            type: string
        affected_range_statements:
          type: array
          description: >-
            The same ranges WITH the ecosystem and package each was published for
            (KN-RANGE-ECO-1). A consumer judging ONE component selects the statements of its
            ecosystem (and package, when named); a statement with no ecosystem applies to all;
            a card with no statements is judged on `affected_ranges` as before.
          items:
            $ref: '#/components/schemas/RangeStatement'
        fixed_versions:
          type: array
          description: >
            Flat union of every fix version on the card, across ALL affected packages. Use it for
            "is a fix published?" and NEVER to decide about one component — a version here may
            belong to a different package entirely. Use `fixes` for that.
          items:
            type: string
        fixes:
          type: array
          description: >
            Fix versions ATTRIBUTED to the package each applies to. One CVE routinely affects many
            packages (a RHEL module advisory can name hundreds), and only this form can answer
            "what fixes MY component?". `package` is absent when the source did not say — NVD's
            CPE data and scanner reports state a fix without naming the package — and an
            unattributed fix must never satisfy a per-component verdict.
          items:
            $ref: '#/components/schemas/FixedVersion'
        epss:
          type: number
        kev:
          type: boolean
        kev_added:
          type: string
          format: date
          description: When CISA listed the CVE in its Known Exploited Vulnerabilities catalogue (EDR-REMEDIATION-01 D5). Absent when not stated.
        kev_due:
          type: string
          format: date
          description: CISA's remediation due date for the CVE. Absent when not stated. Governance's SLA takes the earlier of this and its own deadline.
        kev_ransomware:
          type: boolean
          description: CISA marks the CVE as known to be used in ransomware campaigns.
        exploit_public:
          type: boolean
        priority:
          type: string
          description: Deterministic exploitability level (critical | high+ | high | elevated | informational).
        score:
          type: integer
          description: CVE-intrinsic composite priority score, 0-100 (severity baseline + EPSS + KEV; excludes release-scoped blast).
        range_trust:
          type: string
          enum: [observed, asserted, inferred]
          description: >
            Trust class of the sources that contributed the affected ranges / fixed versions
            (EDR-TRUST-01 T2/T3). Absent when no range evidence contributed. Per field-group,
            not per card - a vendor statement elsewhere must not downgrade public ranges.
        carrier_products:
          type: array
          description: >-
            The products the flaw-describing sources say CARRY the flaw (EDR-CORRELATION-01 D4) —
            the union across sources, normalized. This is the OTHER SIDE of a correlation: a
            component matched against these is a `carrier`, one that matched none is `scope` (it
            was in the rebuild set). Carried on the read API so a consuming context can NAME the
            carrier when no component matched it, instead of leaving a reviewer to infer the fact
            from a claim class (EDR-ATTRIBUTION-01 D10). Empty means no source named a carrier at
            all, which is a materially different gap from "carrier named, none matched".
          items:
            type: string
        applicabilities:
          type: array
          description: Vendor VEX applicability statements held on the card (carried, not applied — Governance decides whether to honor a not_affected for a release).
          items:
            $ref: '#/components/schemas/Applicability'
    SourceRatings:
      type: object
      required: [cve, observations, ratings]
      properties:
        cve:
          type: string
        observations:
          type: array
          items:
            $ref: '#/components/schemas/SourceObservation'
        ratings:
          type: array
          items:
            $ref: '#/components/schemas/SourceRating'
    SourceTime:
      type: object
      description: A source's own timestamp kept as received, its UTC reading, and how it was read.
      properties:
        original:
          type: string
        instant:
          type: string
          format: date-time
        interpretation:
          type: string
          enum: [zone_stated, zone_assumed_utc, unparseable]
    SourceObservation:
      type: object
      required: [id, source, feed, document_ref, complete, first_observed_at]
      properties:
        id:
          type: string
        source:
          type: string
        feed:
          type: string
        document_ref:
          type: string
        revision:
          type: string
        fingerprint:
          type: string
          description: The canonical content fingerprint; identifies the revision when the source states none.
        updated_at:
          $ref: '#/components/schemas/SourceTime'
        complete:
          type: boolean
        applicability:
          type: array
          items:
            type: string
        severity_word:
          type: string
        first_observed_at:
          type: string
          format: date-time
    SourceRating:
      type: object
      required: [id, observation_id, source, feed, assessor, cvss_version, vector, status, recorded_at]
      properties:
        id:
          type: string
        observation_id:
          type: string
        source:
          type: string
        feed:
          type: string
        assessor:
          type: string
        assessor_key:
          type: string
          description: >
            The assessor under the linking policy's alias table (one key per organisation, e.g.
            nvd@nist.gov and NVD both read nvd). Consumers compare assessors by this key.
        publisher:
          type: string
        nvd_type:
          type: string
        cvss_version:
          type: string
        vector:
          type: string
        stated_score:
          type: number
        severity_word:
          type: string
        asserted_context:
          type: string
        inherited_context:
          type: string
        effective_context:
          type: string
        recorded_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, superseded, withdrawn]
        status_event:
          $ref: '#/components/schemas/SourceRatingEvent'
        validation:
          $ref: '#/components/schemas/RatingValidation'
        identity:
          $ref: '#/components/schemas/AssessmentIdentity'
    SourceRatingEvent:
      type: object
      required: [kind, caused_by, learned_at]
      properties:
        kind:
          type: string
          enum: [superseded, withdrawn]
        caused_by:
          type: string
        replaced_by:
          type: string
        source_time:
          $ref: '#/components/schemas/SourceTime'
        learned_at:
          type: string
          format: date-time
    RatingValidation:
      type: object
      required: [calculator_version, result]
      properties:
        calculator_version:
          type: string
        spec_version:
          type: string
        result:
          type: string
          enum: [valid, invalid_vector, unsupported_cvss_version]
        reason:
          type: string
        base_score:
          type: number
        temporal_score:
          type: number
        stated_comparison:
          type: string
          enum: [equal, differs, not_stated]
        validated_at:
          type: string
          format: date-time
    AssessmentIdentity:
      type: object
      required: [key]
      properties:
        key:
          type: string
        linked:
          type: boolean
        ambiguous_link:
          type: boolean
    FixedVersion:
      type: object
      properties:
        package:
          type: string
        version:
          type: string
        ecosystem:
          type: string
          description: >
            Canonical ecosystem the fix was published for (rpm, apk, npm, ...). Absent when the
            source did not say; a consumer must treat an absent ecosystem as matching any
            component (only positive evidence of mismatch excludes).
    SanityFlag:
      type: object
      required: [release_id, purl, cves, reason, flagged_at]
      properties:
        release_id: { type: string }
        purl: { type: string }
        version: { type: string }
        ecosystem: { type: string }
        cves:
          type: integer
          description: Distinct CVEs the feed returned for this component in one discovery.
        reason:
          type: string
        flagged_at:
          type: string
          format: date-time
    RangeStatement:
      type: object
      required: [range]
      properties:
        ecosystem:
          type: string
          description: Canonical ecosystem key (rpm, apk, deb, go, pypi, npm, ...); absent when the source did not say.
        package:
          type: string
          description: The package the range was published for; absent when the source did not say.
        range:
          type: string
    Applicability:
      type: object
      properties:
        package:
          type: string
        status:
          type: string
          enum: [not_affected, affected, fixed, under_investigation, will_not_fix, fix_deferred, out_of_support]
          description: >-
            The VENDOR'S assertion, from the closed set (EDR-VEX-02 D13): the OpenVEX four plus
            Red Hat's `will_not_fix`, `fix_deferred` and `out_of_support`. Never carries Themis's
            determination.
        justification:
          type: string
        advisory:
          type: string
          description: On a `fixed` statement, the advisory that shipped the fix (D14). Absent otherwise.
        fixed_version:
          type: string
          description: On a `fixed` statement, the build the advisory shipped (a NEVRA or a module stream id). Absent otherwise.
        scope_family:
          type: string
          description: >-
            The product FAMILY the vendor said this statement covers, classified from the source
            document's structured CPE (EDR-VEX-02 D5) — e.g. `enterprise-linux` for Red Hat
            Enterprise Linux and its 1:1 rebuilds. Part of the vendor's statement, NOT a
            conclusion about it. Empty means the vendor supplied no readable scope, which a
            consumer MUST read as applicability `unknown` (epistemic uncertainty), never as a
            product mismatch.
        scope_major:
          type: string
          description: >-
            The major version of that family, e.g. `8`. Empty carries the same meaning as an
            empty `scope_family`.
    ProposalProvenance:
      type: object
      properties:
        source:
          type: string
        kind:
          type: string
        observed_at:
          type: string
          format: date-time
    FeedHealthReport:
      type: object
      properties:
        signals_stale:
          type: boolean
          description: True when any Tier-1 (critical) feed is stale — the platform's signals are unreliable.
        feeds:
          type: array
          items:
            $ref: '#/components/schemas/FeedHealthEntry'
        degraded_feeds:
          type: array
          items:
            type: string
          description: Sources of Tier-2 feeds currently failing (degraded, non-blocking).
    FeedHealthEntry:
      type: object
      properties:
        source:
          type: string
        tier:
          type: integer
        status:
          type: string
          description: healthy | stale | degraded | informational.
        consecutive_failures:
          type: integer
        last_success_at:
          type: string
          format: date-time
          nullable: true
    Problem:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
    UnresolvedComponentsReport:
      type: object
      required: [evidence_id, release_id, resolved, unresolved, components]
      properties:
        evidence_id:
          type: string
        release_id:
          type: string
        resolved:
          type: integer
          description: Observations that reached an identity — either their own or an unambiguous twin's.
        unresolved:
          type: integer
          description: Observations retained and counted, with no identity established.
        components:
          type: array
          items:
            $ref: '#/components/schemas/UnresolvedComponent'
    UnresolvedComponent:
      type: object
      required: [name, version, reason]
      properties:
        name:
          type: string
        version:
          type: string
        ecosystem:
          type: string
        origin:
          type: string
          description: Which scanner engine observed it (`scanner/<name>`).
        observed_purl:
          type: string
          description: >-
            The identifier the report offered, verbatim and unmodified — empty when it offered
            none. Never synthesized: EDR-IDENTITY-01 D3 forbids manufacturing a purl, because a
            purl TYPE is an ecosystem claim.
        reason:
          type: string
          enum: [no_candidate, ambiguous]
          description: >-
            `no_candidate` — nothing on the release matches this name+version (the common case is
            a scanner-only release, which has no SBOM and therefore never a twin).
            `ambiguous` — several distinct identities match, which is exactly where a guess would
            be wrong, so no tie-break is invented.
