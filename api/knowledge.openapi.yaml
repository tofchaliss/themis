openapi: 3.0.3
info:
  title: Themis Knowledge API
  version: 1.0.0
  description: >
    Knowledge context (Phase-3 greenfield) — read the enterprise Faultline cards (the
    reconciled view + source-proposal provenance) and the affected-releases rollup.
    Read-only: cards evolve via feeds/correlation, not this API.
servers:
  - url: /api/v1
paths:
  /faultlines:
    get:
      operationId: getFaultlineByCVE
      summary: Get a Faultline by canonical CVE.
      parameters:
        - name: cve
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaultlineView'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /faultlines/{id}:
    get:
      operationId: getFaultlineById
      summary: Get a Faultline by its identity.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaultlineView'
        '404':
          $ref: '#/components/responses/Problem'
  /faultlines/{id}/releases:
    get:
      operationId: getFaultlineReleases
      summary: List the releases affected by a Faultline (rollup projection).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /faultlines/gather:
    post:
      operationId: gatherCVE
      summary: On-demand fetch of ONE CVE's facts through the wired per-CVE sources (G-AI-1).
      description: >-
        The explicit, operator-triggered half of "the AI asks, the feeds gather": consults each
        wired per-CVE source (NVD today) for a CVE the scheduled feeds may not have ingested
        yet, and folds what they return as ORDINARY source Proposals - same ACLs, same
        reconciliation precedence, same "Gathering Is Not Knowing" boundary as any feed. Unlike
        the scheduled sweeps this needs no enable flag: the authenticated POST is the opt-in.
        A write-scoped key is required (it records Proposals).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cve]
              properties:
                cve:
                  type: string
                  description: The CVE id to gather (e.g. CVE-2026-12345).
      responses:
        '200':
          description: >-
            The gather ran; each wired source reports found / recorded / withdrawn / error
            independently. found=false everywhere is an honest answer (the world has nothing
            yet), not a failure.
          content:
            application/json:
              schema:
                type: object
                required: [cve, sources]
                properties:
                  cve:
                    type: string
                  faultline_id:
                    type: string
                    description: The card the facts folded into, when one exists after the gather.
                  sources:
                    type: array
                    items:
                      type: object
                      required: [source]
                      properties:
                        source: { type: string }
                        found: { type: boolean }
                        recorded: { type: boolean, description: "a NEW Proposal folded; a restatement reads false" }
                        withdrawn: { type: boolean }
                        error: { type: string, description: "per-source failure - reported, never fatal to the gather" }
        '400':
          $ref: '#/components/responses/Problem'
        '503':
          description: No per-CVE source is wired on this node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /feeds:
    get:
      operationId: getFeedHealth
      summary: Tier-aware feed-health snapshot (signals_stale flag + per-feed status).
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedHealthReport'
  /scanner-reports/{evidenceId}/unresolved:
    get:
      operationId: getUnresolvedComponents
      summary: Components a scanner report NAMED but whose identity could not be established.
      description: >-
        EDR-IDENTITY-01 D6. An observation whose purl is absent or unusable is resolved onto the
        release's own component when exactly one matches by name+version; anything else abstains
        and is reported here. These observations do NOT reach the Governance posture, so they are
        neither findings nor bystanders — they are evidence Themis holds and cannot yet identify.


        Recomputed on demand from immutable evidence rather than stored: D5 deliberately keeps the
        observed identifier out of Knowledge's rows, so this reads the report and the release
        inventory back through the SAME code path the ingest uses. The answer therefore cannot
        drift from the behaviour it describes.
      parameters:
        - name: evidenceId
          in: path
          required: true
          description: The scanner-report evidence id returned by the upload.
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnresolvedComponentsReport'
        '404':
          description: No such evidence document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The document is not a scanner report, so it has no observations to resolve.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/Problem'
components:
  responses:
    Problem:
      description: Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    FaultlineView:
      type: object
      properties:
        id:
          type: string
        cve:
          type: string
        stage:
          type: string
        view:
          $ref: '#/components/schemas/EnterpriseView'
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/ProposalProvenance'
    EnterpriseView:
      type: object
      properties:
        severity:
          type: string
        summary:
          type: string
          description: >-
            The winning source's short account of WHAT this vulnerability is (e.g. NVD's English
            description or OSV's summary), chosen by the same precedence rule as the headline
            severity but in an independent race. Bounded at ingestion. Descriptive only — no
            verdict consumes it, and it carries no trust class for exactly that reason.
        summary_source:
          type: string
          description: Which source won the summary (explainability, mirrors severity_source).
        cvss_score:
          type: number
        cvss_vector:
          type: string
        severity_source:
          type: string
        affected_ranges:
          type: array
          items:
            type: string
        fixed_versions:
          type: array
          description: >
            Flat union of every fix version on the card, across ALL affected packages. Use it for
            "is a fix published?" and NEVER to decide about one component — a version here may
            belong to a different package entirely. Use `fixes` for that.
          items:
            type: string
        fixes:
          type: array
          description: >
            Fix versions ATTRIBUTED to the package each applies to. One CVE routinely affects many
            packages (a RHEL module advisory can name hundreds), and only this form can answer
            "what fixes MY component?". `package` is absent when the source did not say — NVD's
            CPE data and scanner reports state a fix without naming the package — and an
            unattributed fix must never satisfy a per-component verdict.
          items:
            $ref: '#/components/schemas/FixedVersion'
        epss:
          type: number
        kev:
          type: boolean
        exploit_public:
          type: boolean
        priority:
          type: string
          description: Deterministic exploitability level (critical | high+ | high | elevated | informational).
        score:
          type: integer
          description: CVE-intrinsic composite priority score, 0-100 (severity baseline + EPSS + KEV; excludes release-scoped blast).
        range_trust:
          type: string
          enum: [observed, asserted, inferred]
          description: >
            Trust class of the sources that contributed the affected ranges / fixed versions
            (EDR-TRUST-01 T2/T3). Absent when no range evidence contributed. Per field-group,
            not per card - a vendor statement elsewhere must not downgrade public ranges.
        carrier_products:
          type: array
          description: >-
            The products the flaw-describing sources say CARRY the flaw (EDR-CORRELATION-01 D4) —
            the union across sources, normalized. This is the OTHER SIDE of a correlation: a
            component matched against these is a `carrier`, one that matched none is `scope` (it
            was in the rebuild set). Carried on the read API so a consuming context can NAME the
            carrier when no component matched it, instead of leaving a reviewer to infer the fact
            from a claim class (EDR-ATTRIBUTION-01 D10). Empty means no source named a carrier at
            all, which is a materially different gap from "carrier named, none matched".
          items:
            type: string
        applicabilities:
          type: array
          description: Vendor VEX applicability statements held on the card (carried, not applied — Governance decides whether to honor a not_affected for a release).
          items:
            $ref: '#/components/schemas/Applicability'
    FixedVersion:
      type: object
      properties:
        package:
          type: string
        version:
          type: string
        ecosystem:
          type: string
          description: >
            Canonical ecosystem the fix was published for (rpm, apk, npm, ...). Absent when the
            source did not say; a consumer must treat an absent ecosystem as matching any
            component (only positive evidence of mismatch excludes).
    Applicability:
      type: object
      properties:
        package:
          type: string
        status:
          type: string
          description: e.g. affected | not_affected | fixed | under_investigation.
        justification:
          type: string
        scope_family:
          type: string
          description: >-
            The product FAMILY the vendor said this statement covers, classified from the source
            document's structured CPE (EDR-VEX-02 D5) — e.g. `enterprise-linux` for Red Hat
            Enterprise Linux and its 1:1 rebuilds. Part of the vendor's statement, NOT a
            conclusion about it. Empty means the vendor supplied no readable scope, which a
            consumer MUST read as applicability `unknown` (epistemic uncertainty), never as a
            product mismatch.
        scope_major:
          type: string
          description: >-
            The major version of that family, e.g. `8`. Empty carries the same meaning as an
            empty `scope_family`.
    ProposalProvenance:
      type: object
      properties:
        source:
          type: string
        kind:
          type: string
        observed_at:
          type: string
          format: date-time
    FeedHealthReport:
      type: object
      properties:
        signals_stale:
          type: boolean
          description: True when any Tier-1 (critical) feed is stale — the platform's signals are unreliable.
        feeds:
          type: array
          items:
            $ref: '#/components/schemas/FeedHealthEntry'
        degraded_feeds:
          type: array
          items:
            type: string
          description: Sources of Tier-2 feeds currently failing (degraded, non-blocking).
    FeedHealthEntry:
      type: object
      properties:
        source:
          type: string
        tier:
          type: integer
        status:
          type: string
          description: healthy | stale | degraded | informational.
        consecutive_failures:
          type: integer
        last_success_at:
          type: string
          format: date-time
          nullable: true
    Problem:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
    UnresolvedComponentsReport:
      type: object
      required: [evidence_id, release_id, resolved, unresolved, components]
      properties:
        evidence_id:
          type: string
        release_id:
          type: string
        resolved:
          type: integer
          description: Observations that reached an identity — either their own or an unambiguous twin's.
        unresolved:
          type: integer
          description: Observations retained and counted, with no identity established.
        components:
          type: array
          items:
            $ref: '#/components/schemas/UnresolvedComponent'
    UnresolvedComponent:
      type: object
      required: [name, version, reason]
      properties:
        name:
          type: string
        version:
          type: string
        ecosystem:
          type: string
        origin:
          type: string
          description: Which scanner engine observed it (`scanner/<name>`).
        observed_purl:
          type: string
          description: >-
            The identifier the report offered, verbatim and unmodified — empty when it offered
            none. Never synthesized: EDR-IDENTITY-01 D3 forbids manufacturing a purl, because a
            purl TYPE is an ecosystem claim.
        reason:
          type: string
          enum: [no_candidate, ambiguous]
          description: >-
            `no_candidate` — nothing on the release matches this name+version (the common case is
            a scanner-only release, which has no SBOM and therefore never a twin).
            `ambiguous` — several distinct identities match, which is exactly where a guess would
            be wrong, so no tie-break is invented.
