openapi: 3.0.3
info:
  title: Themis Intelligence API
  version: 1.0.0
  description: >
    Intelligence Gateway (Phase-3 greenfield, Δ1) — the reactive capability surface.
    Invoke a named AI capability by id against a subject identifier; the Gateway grounds
    it via read-API Knowledge Providers, runs the engine, validates in three stages, and
    returns a structured advisory Proposal — or 204 No Content when it declines ("no
    proposal", a first-class safe outcome). Advisory only: the caller records it;
    Intelligence owns no truth.
servers:
  - url: /api/v1
paths:
  /capabilities/{id}/invoke:
    post:
      operationId: invokeCapability
      summary: Invoke a named capability reactively (synchronous).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvokeRequest'
      responses:
        '200':
          description: >-
            The capability's result. Which shape depends on the capability's declared OUTPUT CLASS
            (EDR-TRUST-01 T7): a **Decision** capability returns a validated advisory `Proposal`
            that may enter Governance; an **Information** capability returns an
            `InformationResponse` — an answer rendered for a human that is ephemeral and can never
            become enterprise truth. The two are distinguished by which field is present.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Proposal'
                  - $ref: '#/components/schemas/InformationResponse'
        '204':
          description: No proposal (declined, ungrounded, or unavailable) — a safe outcome.
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /findings/{id}/similar:
    get:
      operationId: getSimilarFindings
      summary: Past Enterprise Positions that resemble this Finding (semantic precedent, no AI).
      description: >-
        The Operational Semantic Index (KS2, Δ3a) served directly to a human. It answers "what
        have we already decided that looks like this?" — semantically similar PAST Positions,
        typically on a DIFFERENT CVE affecting the same component, ranked by cosine similarity.


        This is the same retrieval seam `recommend_position` grounds on. Serving both from one
        service is deliberate: an engineer and the model must never be shown different answers to
        the same question.


        **No model runs.** There is no prompt, no token spend, no budget ceiling and nothing to
        hallucinate — so unlike `/capabilities/{id}/invoke` this endpoint does not have a "declined"
        outcome. An empty list means no precedent was found, which on a young deployment is the
        ordinary answer.


        **Read-only and advisory** (output class Information, EDR-TRUST-01 T7): it proposes no
        stance, reaches no Position, and nothing here needs accepting. Themis stays authoritative —
        every result points back to the Position it was derived from, and the index is a derived,
        rebuildable lens over that truth, never truth itself.


        Contradictory results are a feature, not a fault. Where the enterprise ruled the same shape
        of problem two different ways, both appear — which is precisely the case in which
        `recommend_position` honestly declines, and precisely what a human needs to see.
      parameters:
        - name: id
          in: path
          required: true
          description: Finding id — the subject whose Assessment projection composes the query.
          schema:
            type: string
        - name: k
          in: query
          required: false
          description: Maximum neighbours to return (1-50). Omitted uses the node's configured default.
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: include_same_release
          in: query
          required: false
          description: >-
            Keep the subject's own Release in the candidate set. Off by default: a Finding is not
            precedent for itself, and its siblings on the same Release were usually decided in one
            sitting. Set it to ask the different question "what else did we decide on this release?".
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Ranked precedent, most similar first. An empty list means none was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarFindings'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
components:
  responses:
    Problem:
      description: Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    SimilarFindings:
      type: object
      required: [finding_id, precedents]
      properties:
        finding_id:
          type: string
          description: The subject Finding the query was composed from.
        precedents:
          type: array
          description: Ranked precedent, most similar first. Empty when none was found.
          items:
            $ref: '#/components/schemas/PrecedentPosition'
    PrecedentPosition:
      type: object
      required: [release_id, stance]
      description: >-
        One past Enterprise Position, retrieved as precedent. Every field traces back to a
        Position that Themis owns — this is a lens over KS1, not a record in its own right.
      properties:
        release_id:
          type: string
          description: The Release the past decision was taken on.
        stance:
          type: string
          description: The decided stance (e.g. affected, not_affected, accepted_risk).
        source_cve:
          type: string
          description: >-
            CVE of the precedent decision. It usually DIFFERS from the subject's CVE — matching
            across CVEs on a shared component is the whole point of semantic precedent.
        component:
          type: string
          description: Representative component of the precedent decision.
        rationale:
          type: string
          description: >-
            Why that decision was taken, passed through the node's redaction boundary before
            leaving the process. The stored Position is never modified by redaction.
        score:
          type: number
          format: double
          description: >-
            Cosine similarity in [0,1] for a semantically retrieved precedent. 0 marks an
            exact-CVE match, which is found by lookup rather than by similarity and therefore
            has no meaningful score — not "least similar".
        release_overlap:
          type: number
          format: double
          description: >-
            G-AI-3 delta signal - posture overlap in [0,1] between the precedent's release and
            the subject's, from the deterministic comparison read (EDR-GOVERNANCE-01 D16):
            persisting / (fixed + new + persisting). Absent when the comparison could not be
            computed - an unknown delta leaves the precedent unweighted, never penalized. The
            ranking you receive is already weighted by it (down-weight only, never dropped).
    InformationResponse:
      type: object
      description: >-
        An answer rendered for a human (EDR-TRUST-01 T7). It is **ephemeral**: it is not recorded
        as enterprise truth, there is nothing to accept or reject, and no Governance stage follows
        it — which is why Grounding Verification is its only gate and is treated as load-bearing.
      properties:
        capability:
          type: string
          description: The originating capability ref, e.g. "plan_remediation@v1".
        subject_id:
          type: string
          description: What the answer is about — a Release id for a release-scoped capability.
        information:
          type: string
          description: >-
            The answer itself. Any identifier the prose names that was NOT in the model's
            grounding is flagged inline with an `[UNVERIFIED MENTIONS ...]` caveat rather than
            carried in a separate field — prose cannot be schema-checked, and a caveat stored
            elsewhere is one a reader can miss (TRUST-8).
        precedents_used:
          type: integer
          description: >-
            How many past Enterprise Positions grounded this recommendation — semantic neighbours
            retrieved from the Operational Semantic Index (Delta-3a) plus any exact-CVE fallback.

            It is the only externally visible evidence that the retrieval plane contributed at all.
            A caller comparing two recommendations cannot otherwise tell whether the enterprise's
            own decision history was consulted, which makes the claim that it changes outcomes
            unfalsifiable from outside.
        decided_by:
          type: string
          description: Which plan step produced it, e.g. "llm:information" or "rule:nothing-outstanding".
        correlation_id:
          type: string
    InvokeRequest:
      type: object
      description: >
        Invoke a capability against a Selection - a user-addressable entry point plus the
        identifiers picked (EDR-TRUST-01 T9). Supply either `subject` or the deprecated
        `finding_id`; `subject` wins if both are present.
      properties:
        subject:
          $ref: '#/components/schemas/Selection'
        finding_id:
          type: string
          deprecated: true
          description: >
            Deprecated alias for `subject: {type: finding, ids: [<id>]}`. Accepted for one
            release so existing callers keep working while they migrate; remove after.
        correlation_id:
          type: string
          description: Optional correlation id for telemetry; generated if absent.
    Selection:
      type: object
      required: [type, ids]
      description: >
        What the capability is invoked against. `ids` is a set because a user may pick
        several things of one kind (e.g. several Findings for a VEX draft); how many a given
        capability accepts is that capability's declared cardinality, enforced before any
        grounding is assembled.
      properties:
        type:
          type: string
          enum: [finding, release]
          description: The user-addressable entry point. Not a domain entity - see EDR-TRUST-01 T9.
        ids:
          type: array
          minItems: 1
          items:
            type: string
    Proposal:
      type: object
      properties:
        capability:
          type: string
        finding_id:
          type: string
        stance:
          type: string
        confidence:
          type: number
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        reasoning:
          type: string
        rationale_warnings:
          type: array
          description: >
            Identifier-shaped tokens the free-text `reasoning` names that the authoritative
            grounding does NOT contain (EDR-TRUST-01 T8). ADVISORY — the proposal's structured
            `evidence` already passed Grounding Verification, so this does not invalidate it;
            it marks that the narrative cites ids nobody supplied, which is the failure a
            reviewer cannot see. Absent/empty means no ids were invented, NOT that the
            narrative is true — prose is not verifiable and is never claimed to be.
          items:
            type: string
        provider:
          type: string
        model:
          type: string
        precedents_used:
          type: integer
          description: >-
            How many past Enterprise Positions grounded this recommendation — semantic neighbours
            retrieved from the Operational Semantic Index (Delta-3a) plus any exact-CVE fallback.

            The only externally visible evidence that the retrieval plane contributed. Without it a
            caller cannot tell whether the enterprise's own decision history was consulted, which
            leaves the claim that it changes outcomes unfalsifiable from outside.
        decided_by:
          type: string
          description: Which plan step decided — "rule:<stance>" or "llm:<stance>".
        correlation_id:
          type: string
    Evidence:
      type: object
      properties:
        kind:
          type: string
        ref:
          type: string
    Problem:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
