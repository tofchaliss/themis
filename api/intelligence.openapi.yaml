openapi: 3.0.3
info:
  title: Themis Intelligence API
  version: 1.0.0
  description: >
    Intelligence Gateway (Phase-3 greenfield, Δ1) — the reactive capability surface.
    Invoke a named AI capability by id against a subject identifier; the Gateway grounds
    it via read-API Knowledge Providers, runs the engine, validates in three stages, and
    returns a structured advisory Proposal — or 204 No Content when it declines ("no
    proposal", a first-class safe outcome). Advisory only: the caller records it;
    Intelligence owns no truth.
servers:
  - url: /api/v1
paths:
  /capabilities/{id}/invoke:
    post:
      operationId: invokeCapability
      summary: Invoke a named capability reactively (synchronous).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvokeRequest'
      responses:
        '200':
          description: >-
            The capability's result. Which shape depends on the capability's declared OUTPUT CLASS
            (EDR-TRUST-01 T7): a **Decision** capability returns a validated advisory `Proposal`
            that may enter Governance; an **Information** capability returns an
            `InformationResponse` — an answer rendered for a human that is ephemeral and can never
            become enterprise truth. The two are distinguished by which field is present.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Proposal'
                  - $ref: '#/components/schemas/InformationResponse'
        '204':
          description: No proposal (declined, ungrounded, or unavailable) — a safe outcome.
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
components:
  responses:
    Problem:
      description: Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    InformationResponse:
      type: object
      description: >-
        An answer rendered for a human (EDR-TRUST-01 T7). It is **ephemeral**: it is not recorded
        as enterprise truth, there is nothing to accept or reject, and no Governance stage follows
        it — which is why Grounding Verification is its only gate and is treated as load-bearing.
      properties:
        capability:
          type: string
          description: The originating capability ref, e.g. "plan_remediation@v1".
        subject_id:
          type: string
          description: What the answer is about — a Release id for a release-scoped capability.
        information:
          type: string
          description: >-
            The answer itself. Any identifier the prose names that was NOT in the model's
            grounding is flagged inline with an `[UNVERIFIED MENTIONS ...]` caveat rather than
            carried in a separate field — prose cannot be schema-checked, and a caveat stored
            elsewhere is one a reader can miss (TRUST-8).
        decided_by:
          type: string
          description: Which plan step produced it, e.g. "llm:information" or "rule:nothing-outstanding".
        correlation_id:
          type: string
    InvokeRequest:
      type: object
      description: >
        Invoke a capability against a Selection - a user-addressable entry point plus the
        identifiers picked (EDR-TRUST-01 T9). Supply either `subject` or the deprecated
        `finding_id`; `subject` wins if both are present.
      properties:
        subject:
          $ref: '#/components/schemas/Selection'
        finding_id:
          type: string
          deprecated: true
          description: >
            Deprecated alias for `subject: {type: finding, ids: [<id>]}`. Accepted for one
            release so existing callers keep working while they migrate; remove after.
        correlation_id:
          type: string
          description: Optional correlation id for telemetry; generated if absent.
    Selection:
      type: object
      required: [type, ids]
      description: >
        What the capability is invoked against. `ids` is a set because a user may pick
        several things of one kind (e.g. several Findings for a VEX draft); how many a given
        capability accepts is that capability's declared cardinality, enforced before any
        grounding is assembled.
      properties:
        type:
          type: string
          enum: [finding, release]
          description: The user-addressable entry point. Not a domain entity - see EDR-TRUST-01 T9.
        ids:
          type: array
          minItems: 1
          items:
            type: string
    Proposal:
      type: object
      properties:
        capability:
          type: string
        finding_id:
          type: string
        stance:
          type: string
        confidence:
          type: number
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        reasoning:
          type: string
        rationale_warnings:
          type: array
          description: >
            Identifier-shaped tokens the free-text `reasoning` names that the authoritative
            grounding does NOT contain (EDR-TRUST-01 T8). ADVISORY — the proposal's structured
            `evidence` already passed Grounding Verification, so this does not invalidate it;
            it marks that the narrative cites ids nobody supplied, which is the failure a
            reviewer cannot see. Absent/empty means no ids were invented, NOT that the
            narrative is true — prose is not verifiable and is never claimed to be.
          items:
            type: string
        provider:
          type: string
        model:
          type: string
        decided_by:
          type: string
          description: Which plan step decided — "rule:<stance>" or "llm:<stance>".
        correlation_id:
          type: string
    Evidence:
      type: object
      properties:
        kind:
          type: string
        ref:
          type: string
    Problem:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
