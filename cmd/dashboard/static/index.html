<!doctype html>
<html lang="en" data-theme="enterprise">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Themis — Security Posture</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='4' y='24' font-size='22'%3E%E2%9A%96%3C/text%3E%3C/svg%3E">
</head>
<body>

<nav class="rail" aria-label="Primary">
  <a class="rail-mark" href="#/" title="Themis — overview">Θ</a>
  <a class="rail-link" href="#/" data-view="overview" title="Overview">
    <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5"/></svg>
    <span class="rail-label">Overview</span>
  </a>
  <a class="rail-link" href="#/estate" data-view="estate" title="Estate — products, projects, releases">
    <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="4" r="2.2"/><circle cx="4" cy="15" r="2.2"/><circle cx="16" cy="15" r="2.2"/><path d="M10 6.5v4M8.5 9.5 5 13M11.5 9.5 15 13" stroke-width="1.6" fill="none"/></svg>
    <span class="rail-label">Estate</span>
  </a>
  <a class="rail-link" href="#/sbom" data-view="sbom" title="SBOM manager — upload and review evidence">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2 3 5.5v9L10 18l7-3.5v-9L10 2Z" fill="none" stroke-width="1.6"/><path d="M3 5.5 10 9l7-3.5M10 9v9" fill="none" stroke-width="1.6"/></svg>
    <span class="rail-label">SBOM manager</span>
  </a>
  <a class="rail-link" href="#/feeds" data-view="feeds" title="Feed health">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 16a2 2 0 1 1 .001.001M3 9a8 8 0 0 1 8 8M3 3a14 14 0 0 1 14 14" fill="none" stroke-width="1.8"/></svg>
    <span class="rail-label">Feeds</span>
  </a>
</nav>

<div class="frame">
  <header class="topbar">
    <nav id="crumbs" class="crumbs" aria-label="Breadcrumb"><span class="crumb-current">Overview</span></nav>
    <div class="topbar-right">
      <button id="theme-toggle" class="theme-toggle" title="Switch style (Enterprise / Midnight)" aria-label="Switch between Enterprise and Midnight style">
        <span class="tt-icon" aria-hidden="true">☀</span><span class="tt-name">Enterprise</span>
      </button>
      <span id="user-chip" class="user-chip" title="Signed-in user (from THEMIS_DASHBOARD_USER when auth is off)">
        <i id="user-initials">·</i><span id="user-name"></span>
      </span>
      <form id="logout-form" method="post" action="/logout" style="display:none">
        <button type="submit" class="theme-toggle" title="End this session">Sign out</button>
      </form>
    </div>
  </header>

  <main id="main" class="main" tabindex="-1">
    <!-- views render here -->
  </main>
</div>

<aside id="drawer" class="drawer" aria-label="Finding detail" hidden>
  <div class="drawer-head">
    <div id="drawer-title" class="drawer-title"></div>
    <button id="drawer-close" class="icon-btn" title="Close" aria-label="Close detail">✕</button>
  </div>
  <div id="drawer-body" class="drawer-body"></div>
</aside>
<div id="drawer-scrim" class="drawer-scrim" hidden></div>

<div id="toast" class="toast" role="status" hidden></div>

<script src="app.js"></script>
</body>
</html>
